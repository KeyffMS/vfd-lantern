[workspace]
members = [
    "crates/lantern-domain",
    "crates/lantern-profile",
    "crates/lantern-app",
    "crates/lantern-storage",
    "crates/lantern-transport",
    "crates/lantern-tui",
    "crates/lantern-sim",
    "crates/vfd-lantern",
]
default-members = ["crates/vfd-lantern"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/KeyffMS/vfd-lantern"
homepage = "https://vfd-lantern.aiteracja.pl"
authors = ["VFD Lantern contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
