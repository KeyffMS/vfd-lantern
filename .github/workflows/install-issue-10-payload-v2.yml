name: Install issue 10 payload manifest v2

on:
  push:
    branches:
      - agent/issue-10-publisher
    paths:
      - .github/workflows/install-issue-10-payload-v2.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: install-issue-10-payload-v2
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 8473bc93e95dfe8ddcb815c2ff7d7f1c521a9bcf
      BASE_TREE_SHA: d2bef83ca45bfed606eb75ef37527f6e255bf481
      EXPECTED_PATCH_BYTES: '103880'
      PART_000_BLOB: eeef28167285f18e128deea2fe7d5b8e8232e1c8
      PART_001_BLOB: 0426d7c8fcfe7e468dfd2ffacf30a2f1b56fbcec
      PART_002_BLOB: 2190b13d620b663d12ec6996d7090f4b0d563571
      PART_003_BLOB: f73c76ad78686f601aef4de740a53d12895054f9

    steps:
      - name: Check out publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-10-publisher
          fetch-depth: 0

      - name: Verify blobs and publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'VFD Lantern contributors'
          git config user.email 'actions@users.noreply.github.com'

          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          mkdir -p .issue10-publisher /tmp/issue10-install
          parts='[]'
          : > /tmp/issue10-install/payload.txt

          for index in 000 001 002 003; do
            case "$index" in
              000) blob="$PART_000_BLOB" ;;
              001) blob="$PART_001_BLOB" ;;
              002) blob="$PART_002_BLOB" ;;
              003) blob="$PART_003_BLOB" ;;
            esac

            response=$(curl --fail-with-body --silent --show-error \
              "${auth[@]}" "$api/git/blobs/$blob")
            path=".issue10-publisher/part-$index"
            jq -r .content <<<"$response" | tr -d '\r\n' | base64 --decode > "$path"

            test "$(git hash-object "$path")" = "$blob"
            bytes=$(wc -c < "$path" | tr -d ' ')
            sha=$(sha256sum "$path" | awk '{print $1}')
            cat "$path" >> /tmp/issue10-install/payload.txt

            parts=$(jq -c \
              --arg path "$path" \
              --argjson bytes "$bytes" \
              --arg sha "$sha" \
              --arg blob "$blob" \
              '. + [{path:$path,bytes:$bytes,sha256:$sha,git_blob_sha:$blob}]' \
              <<<"$parts")
          done

          tr -d '\r\n' < /tmp/issue10-install/payload.txt \
            > /tmp/issue10-install/payload.compact
          base64 --decode /tmp/issue10-install/payload.compact \
            > /tmp/issue10.patch

          test "$(wc -c < /tmp/issue10.patch | tr -d ' ')" = "$EXPECTED_PATCH_BYTES"
          grep -q '^diff --git ' /tmp/issue10.patch
          grep -q 'pub struct PollPlanner' /tmp/issue10.patch
          grep -q 'pub struct PollExecutor' /tmp/issue10.patch
          patch_sha=$(sha256sum /tmp/issue10.patch | awk '{print $1}')

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE_SHA"

          rm -rf /tmp/issue10-main
          git worktree add --detach /tmp/issue10-main "$BASE_SHA"
          cd /tmp/issue10-main
          git apply --check --whitespace=error-all /tmp/issue10.patch
          git apply --index --whitespace=error-all /tmp/issue10.patch
          git diff --cached --check

          test -f crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollPlanner' crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollExecutor' crates/lantern-app/src/poll.rs
          grep -q 'MonotonicClock' crates/lantern-app/src/poll.rs

          candidate_tree=$(git write-tree)
          git diff --cached --name-only > /tmp/issue10-install/changed-files.txt
          test "$(wc -l < /tmp/issue10-install/changed-files.txt | tr -d ' ')" = 11
          while IFS= read -r changed; do
            case "$changed" in
              Cargo.lock|crates/lantern-app/*|crates/lantern-sim/*) ;;
              *) printf 'forbidden issue #10 path: %s\n' "$changed" >&2; exit 1 ;;
            esac
          done < /tmp/issue10-install/changed-files.txt

          cd "$GITHUB_WORKSPACE"
          jq -n \
            --arg schema 'vfd-lantern-issue10-payload-v1' \
            --arg base_sha "$BASE_SHA" \
            --arg base_tree_sha "$BASE_TREE_SHA" \
            --arg patch_sha256 "$patch_sha" \
            --arg expected_tree_sha "$candidate_tree" \
            --arg patch_encoding 'base64-split-lines' \
            --arg commit_message 'Implement deterministic PollPlanner and bounded polling executor (#10)' \
            --arg delivery_branch 'agent/issue-10' \
            --argjson patch_bytes "$EXPECTED_PATCH_BYTES" \
            --argjson parts "$parts" \
            '{schema:$schema,base_sha:$base_sha,base_tree_sha:$base_tree_sha,patch_sha256:$patch_sha256,patch_bytes:$patch_bytes,expected_tree_sha:$expected_tree_sha,patch_encoding:$patch_encoding,commit_message:$commit_message,delivery_branch:$delivery_branch,allowed_paths:["Cargo.lock","crates/lantern-app/**","crates/lantern-sim/**"],parts:$parts}' \
            > .issue10-publisher/manifest.json

          jq -e . .issue10-publisher/manifest.json >/dev/null
          git add -- \
            .issue10-publisher/part-000 \
            .issue10-publisher/part-001 \
            .issue10-publisher/part-002 \
            .issue10-publisher/part-003 \
            .issue10-publisher/manifest.json
          git diff --cached --check

          if git diff --cached --quiet; then
            printf 'Verified manifest already present; no commit required.\n'
            exit 0
          fi

          git commit -m 'Install verified issue 10 payload manifest'
          manifest_commit=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/agent/issue-10-publisher

          body=$(cat <<EOF
          <!-- issue-10-manifest:$manifest_commit -->
          ## Wersjonowany payload #10 zainstalowany

          - payload commit: \`$manifest_commit\`
          - base SHA: \`$BASE_SHA\`
          - base tree: \`$BASE_TREE_SHA\`
          - patch bytes: \`$EXPECTED_PATCH_BYTES\`
          - patch SHA-256: \`$patch_sha\`
          - expected candidate tree: \`$candidate_tree\`
          - części: **4**, każda zweryfikowana przez Git blob SHA i SHA-256
          - zmienionych plików kandydata: **11**

          Payload nie korzysta z zewnętrznego magazynu. Kolejny przebieg finalizera weryfikuje pełny gate, PR CI amd64/arm64 i CI merge commita.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error --request POST \
            "${auth[@]}" "$api/issues/10/comments" --data "$payload" >/dev/null
