name: Issue 24 native package acceptance

on:
  push:
    branches:
      - agent/issue-24
    paths:
      - '.github/workflows/issue24-native-package-acceptance.yml'
      - 'Cargo.toml'
      - 'crates/vfd-lantern/Cargo.toml'
      - 'dist-workspace.toml'
      - 'scripts/release/**'

permissions:
  contents: read

jobs:
  native-package:
    # Arm64 acceptance is deferred; see docs/development/platform-policy.md.
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Verify active Debian 13 amd64 platform
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = vfd-lantern-podman-01
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = debian
          test "${VERSION_ID%%.*}" = 13

      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Debian package test tools
        run: sh scripts/release/ensure-runner-tools.sh package

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for tool in git cc make pkg-config jq objcopy xz podman sha256sum; do
            command -v "$tool"
          done
          pkg-config --exists openssl
          pkg-config --exists libudev
          podman version

      - name: Install pinned Rust and release tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          export CARGO_INSTALL_ROOT="$HOME/.cache/vfd-lantern-cargo-tools"
          export CARGO_TARGET_DIR="$HOME/.cache/vfd-lantern-cargo-install-target"
          sh scripts/install-cargo-tools.sh release

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo test --locked -p lantern-release
          mdbook build
          grep -Fq 'publish = false' crates/vfd-lantern/Cargo.toml
          grep -Fq 'dist = true' crates/vfd-lantern/Cargo.toml

      - name: Resolve deterministic inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "vfd-lantern") | .version')
          image=$(awk -F ' = ' '
            /^\[images\]$/ { in_images=1; next }
            /^\[/ { if (in_images) exit }
            in_images && $1 == "debian-trixie-slim" { gsub(/"/, "", $2); print $2; found=1; exit }
            END { if (!found) exit 1 }
          ' tools.lock.toml)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Native clean build A
        shell: bash
        env:
          VFD_RELEASE_COMMIT: ${{ steps.inputs.outputs.commit }}
          VFD_RELEASE_VERSION: ${{ steps.inputs.outputs.version }}
          VFD_RELEASE_QUALIFICATION_INDEX: release/fixtures/qualification-index-v1.json
          VFD_RELEASE_IMAGE_DIGEST: sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
          VFD_RELEASE_ARCH: amd64
          VFD_RELEASE_TEST_MODE: '1'
        run: |
          set -euo pipefail
          cargo clean
          sh scripts/release/build-product.sh
          stage=target/release-stage/amd64
          test -d "$stage/arch"
          test -d "$stage/common"
          (
            cd "$stage"
            find arch common -type f -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done
          ) > "$RUNNER_TEMP/repro-a.sha256"
          rm -rf "$RUNNER_TEMP/package-a"
          cp -a "$stage" "$RUNNER_TEMP/package-a"

      - name: Install, smoke and uninstall exact deb in pinned Trixie
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/package-a"
          deb=$(find "$stage/arch" -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          test -f "$stage/common/profiles-v1.json"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/package-a:/package:ro" \
            -w /work \
            -e VFD_PACKAGE_DEB=/package/arch/$(basename "$deb") \
            -e VFD_EXPECTED_PACKAGED_MANIFEST=/package/common/profiles-v1.json \
            "${{ steps.inputs.outputs.image }}" \
            sh scripts/release/test-deb.sh

      - name: Native clean build B and byte reproducibility check
        shell: bash
        env:
          VFD_RELEASE_COMMIT: ${{ steps.inputs.outputs.commit }}
          VFD_RELEASE_VERSION: ${{ steps.inputs.outputs.version }}
          VFD_RELEASE_QUALIFICATION_INDEX: release/fixtures/qualification-index-v1.json
          VFD_RELEASE_IMAGE_DIGEST: sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
          VFD_RELEASE_ARCH: amd64
          VFD_RELEASE_TEST_MODE: '1'
        run: |
          set -euo pipefail
          cargo clean
          sh scripts/release/build-product.sh
          stage=target/release-stage/amd64
          (
            cd "$stage"
            find arch common -type f -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done
          ) > "$RUNNER_TEMP/repro-b.sha256"
          diff -u "$RUNNER_TEMP/repro-a.sha256" "$RUNNER_TEMP/repro-b.sha256"

      - name: Upload verified native stage A
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue24-native-amd64
          path: ${{ runner.temp }}/package-a
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: native-package
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Verify active Debian 13 amd64 platform
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = vfd-lantern-podman-01
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = debian
          test "${VERSION_ID%%.*}" = 13

      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Download verified native stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: issue24-native-*
          path: target/native

      - name: Assemble and finalize product snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          export VFD_AMD64_STAGE=target/native/issue24-native-amd64
          export VFD_CANDIDATE_PRODUCT_DIR=target/candidate-product
          sh scripts/release/assemble-matrix.sh
          export VFD_RELEASE_COMMIT=$(git rev-parse HEAD)
          export VFD_RELEASE_VERSION=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "vfd-lantern") | .version')
          export VFD_RELEASE_IMAGE_DIGEST=sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
          sh scripts/release/finalize-product-assets.sh
          (cd target/candidate-product && sha256sum -c SHA256SUMS)
          test ! -e target/candidate-product/candidate-manifest-v1.json

      - name: Upload assembled product snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue24-assembled-product
          path: target/candidate-product
          if-no-files-found: error
          retention-days: 14

