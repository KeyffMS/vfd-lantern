name: Integrate issue 15 parameter TUI

on:
  push:
    branches: [agent/issue-15]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-15
          fetch-depth: 0
      - name: Apply, format and test TUI integration
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/issue15_tui_edit.rs -o /tmp/issue15_tui_edit
          /tmp/issue15_tui_edit
          perl -0pi -e 's/    ConnectionEdit, Screen, UiAction, UiState, map_parameter_editor_key, map_parameter_key,\n    monitoring_parameter_matches_filter, profile_matches_filter,\n/    ConnectionEdit, Screen, UiAction, UiState, monitoring_parameter_matches_filter,\n    parameter_keymap::{map_parameter_editor_key, map_parameter_key}, profile_matches_filter,\n/' crates/lantern-tui/src/keymap.rs
          perl -0pi -e 's/fn editor_lines\(\n    browser:/fn editor_lines(\n    _browser:/' crates/lantern-tui/src/parameter_render.rs
          perl -0pi -e 's/    #\[must_use\]\n    #\[must_use\]\n/    #[must_use]\n/g' crates/lantern-profile/src/validate/mod.rs
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --locked -p lantern-tui
          cargo test --locked -p lantern-app --all-features
          git rm .github/workflows/issue15-tui-integrate.yml .github/issue15_tui_edit.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#15): add virtualized parameter browser TUI'
          git push origin HEAD:agent/issue-15
