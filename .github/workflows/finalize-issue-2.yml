name: Finalize issue 2 supply-chain correction

on:
  push:
    branches:
      - agent/issue-2-finalizer

permissions:
  contents: write

concurrency:
  group: issue-2-supply-chain-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            libssl-dev \
            libudev-dev \
            pkg-config \
            rustup

      - name: Check out automation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Build and validate correction candidate
        env:
          CARGO_INSTALL_ROOT: /tmp/vfd-lantern-cargo-tools
        run: bash scripts/finalize-issue-2/run-portable.sh

      - name: Upload tested correction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-2-supply-chain-correction
          path: issue2-output
          if-no-files-found: error
          retention-days: 3

      - name: Publish exact tested correction
        env:
          DELIVERY_BRANCH: agent/issue-2-supply-chain-correction
        run: |
          set -euo pipefail

          BASE_SHA=$(cat issue2-output/base-sha.txt)
          EXPECTED_TREE=$(cat issue2-output/candidate-tree.txt)

          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$DELIVERY_BRANCH:refs/remotes/origin/$DELIVERY_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/$DELIVERY_BRANCH)" = "$BASE_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce full supply-chain policy (#2)"

          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push \
            --force-with-lease="refs/heads/$DELIVERY_BRANCH:$BASE_SHA" \
            origin "HEAD:refs/heads/$DELIVERY_BRANCH"

          printf 'Published commit %s with tested tree %s\n' \
            "$(git rev-parse HEAD)" "$EXPECTED_TREE"
