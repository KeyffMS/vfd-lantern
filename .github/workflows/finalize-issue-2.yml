name: Finalize issue 2 supply-chain correction

on:
  push:
    branches:
      - agent/issue-2-finalizer

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            libssl-dev \
            libudev-dev \
            pkg-config \
            rustup

      - name: Check out automation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Build, validate and publish one logical correction commit
        shell: bash
        env:
          DELIVERY_BRANCH: agent/issue-2-supply-chain-correction
          CARGO_INSTALL_ROOT: /tmp/vfd-lantern-cargo-tools
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "VFD Lantern contributors"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach refs/remotes/origin/main
          git switch -c "$DELIVERY_BRANCH"

          cat > scripts/install-cargo-tools.sh <<'SCRIPT'
          #!/bin/sh
          set -eu

          TOOLS_FILE=${TOOLS_FILE:-tools.lock.toml}
          INSTALL_ROOT=${CARGO_INSTALL_ROOT:-${RUNNER_TEMP:-/tmp}/vfd-lantern-cargo-tools}
          SCOPE=${1:-supply-chain}

          if [ ! -f "$TOOLS_FILE" ]; then
              printf 'missing tools manifest: %s\n' "$TOOLS_FILE" >&2
              exit 1
          fi

          version_for() {
              tool=$1
              awk -v wanted="$tool" '
                  /^\[tools\][[:space:]]*$/ { in_tools = 1; next }
                  /^\[/ { if (in_tools) exit }
                  in_tools && /^[[:space:]]*[A-Za-z0-9_-]+[[:space:]]*=/ {
                      line = $0
                      sub(/[[:space:]]*=.*/, "", line)
                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                      if (line == wanted) {
                          value = $0
                          sub(/^[^=]*=[[:space:]]*"/, "", value)
                          sub(/"[[:space:]]*$/, "", value)
                          print value
                          found = 1
                          exit
                      }
                  }
                  END { if (!found) exit 1 }
              ' "$TOOLS_FILE"
          }

          install_tool() {
              package=$1
              version=$(version_for "$package") || {
                  printf 'tool %s is not pinned in %s\n' "$package" "$TOOLS_FILE" >&2
                  exit 1
              }
              printf 'installing %s %s into %s\n' "$package" "$version" "$INSTALL_ROOT"
              cargo install --locked --root "$INSTALL_ROOT" --version "$version" "$package"
          }

          mkdir -p "$INSTALL_ROOT"

          case "$SCOPE" in
              supply-chain)
                  install_tool cargo-machete
                  install_tool cargo-deny
                  install_tool cargo-audit
                  install_tool cargo-vet
                  ;;
              *)
                  printf 'unsupported tool scope: %s\n' "$SCOPE" >&2
                  exit 1
                  ;;
          esac

          if [ -n "${GITHUB_PATH:-}" ]; then
              printf '%s/bin\n' "$INSTALL_ROOT" >> "$GITHUB_PATH"
          fi

          printf 'installed pinned %s tools; add %s/bin to PATH when running locally\n' \
              "$SCOPE" "$INSTALL_ROOT"
          SCRIPT
          chmod +x scripts/install-cargo-tools.sh

          cat > scripts/check-supply-chain.sh <<'SCRIPT'
          #!/bin/sh
          set -eu

          REPORT=${CARGO_VET_REPORT:-target/supply-chain/cargo-vet-summary.json}
          REPORT_DIR=$(dirname "$REPORT")
          mkdir -p "$REPORT_DIR"

          baseline=not_run
          machete=not_run
          deny=not_run
          audit=not_run
          vet=not_run

          count_entries() {
              prefix=$1
              file=$2
              if [ ! -f "$file" ]; then
                  printf '0\n'
                  return
              fi
              awk -v prefix="$prefix" '
                  $0 ~ "^\\[\\[" prefix "\\." { count += 1 }
                  END { print count + 0 }
              ' "$file"
          }

          write_report() {
              command_status=$1
              audited=$(count_entries audits supply-chain/audits.toml)
              imported=$(count_entries audits supply-chain/imports.lock)
              exempted=$(count_entries exemptions supply-chain/config.toml)
              if [ "$vet" = pass ]; then
                  unaudited=0
              else
                  unaudited=null
              fi
              lock_sha=$(sha256sum Cargo.lock | awk '{ print $1 }')
              cat > "$REPORT" <<JSON
          {
            "schema_version": 1,
            "cargo_lock_sha256": "$lock_sha",
            "checks": {
              "baseline": "$baseline",
              "cargo_machete": "$machete",
              "cargo_deny": "$deny",
              "cargo_audit": "$audit",
              "cargo_vet": "$vet"
            },
            "cargo_vet_coverage": {
              "audited_entries": $audited,
              "imported_entries": $imported,
              "exempted_entries": $exempted,
              "unaudited_required_entries": $unaudited,
              "exemptions_are_audits": false
            },
            "command_status": $command_status,
            "note": "A Cargo Vet exemption is policy coverage, not an independent source audit."
          }
          JSON
          }

          finish() {
              status=$?
              trap - EXIT
              write_report "$status"
              exit "$status"
          }
          trap finish EXIT

          sh scripts/check-supply-chain-baseline.sh
          baseline=pass

          cargo machete
          machete=pass

          cargo deny check
          deny=pass

          cargo audit
          audit=pass

          cargo vet check
          vet=pass

          printf 'full supply-chain checks passed\n'
          SCRIPT
          chmod +x scripts/check-supply-chain.sh

          cat > .github/workflows/ci.yml <<'WORKFLOW'
          name: CI

          on:
            push:
              branches: [main, "agent/**"]
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: ci-__DOLLAR__{{ github.workflow }}-__DOLLAR__{{ github.ref }}
            cancel-in-progress: true

          jobs:
            rust:
              name: Debian 13 / Rust 1.97.1 / __DOLLAR__{{ matrix.arch }}
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
              runs-on: __DOLLAR__{{ matrix.runner }}
              container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd

              steps:
                - name: Install system dependencies
                  run: |
                    apt-get update
                    apt-get install --yes --no-install-recommends \
                      build-essential \
                      ca-certificates \
                      git \
                      libssl-dev \
                      libudev-dev \
                      pkg-config \
                      rustup

                - name: Check out repository
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

                - name: Install pinned Rust toolchain
                  run: |
                    rustup toolchain install 1.97.1 \
                      --profile minimal \
                      --component rustfmt \
                      --component clippy \
                      --component llvm-tools-preview
                    rustup default 1.97.1
                    rustc --version
                    cargo --version

                - name: Install pinned supply-chain tools
                  env:
                    CARGO_INSTALL_ROOT: __DOLLAR__{{ runner.temp }}/vfd-lantern-cargo-tools
                  run: sh scripts/install-cargo-tools.sh supply-chain

                - name: Validate lockfile and metadata
                  run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

                - name: Build workspace
                  run: cargo build --workspace --locked

                - name: Check formatting
                  run: cargo fmt --all -- --check

                - name: Run Clippy
                  run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

                - name: Run tests
                  run: cargo test --workspace --all-features --locked

                - name: Build documentation
                  env:
                    RUSTDOCFLAGS: -D warnings
                  run: cargo doc --workspace --no-deps --locked

                - name: Check architecture boundaries
                  run: sh scripts/check-architecture.sh

                - name: Check supply chain
                  env:
                    CARGO_VET_REPORT: target/supply-chain/cargo-vet-summary-__DOLLAR__{{ matrix.arch }}.json
                  run: sh scripts/check-supply-chain.sh

                - name: Upload supply-chain report
                  if: always()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: supply-chain-__DOLLAR__{{ matrix.arch }}
                    path: target/supply-chain
                    if-no-files-found: warn
                    retention-days: 14
          WORKFLOW
          sed -i 's/__DOLLAR__/$/g' .github/workflows/ci.yml

          cat > docs/development/toolchain.md <<'DOC'
          # Pinned development toolchain

          VFD Lantern targets Debian 13 (Trixie) on amd64 and arm64. Install `rustup` from
          APT, then let `rust-toolchain.toml` select Rust 1.97.1. Do not use `curl | sh`.

          ```sh
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential ca-certificates git libssl-dev libudev-dev pkg-config rustup
          rustup toolchain install 1.97.1 --profile minimal \
            --component rustfmt --component clippy --component llvm-tools-preview
          cargo build --workspace --locked
          cargo test --workspace --all-features --locked
          ```

          Direct crate versions are centralized in `[workspace.dependencies]`. Binary tool
          versions are centralized in `tools.lock.toml`. Updates require a dedicated change
          with a refreshed lockfile and the full CI suite.

          ## Supply-chain gate

          Install the pinned supply-chain tools without `curl | sh`:

          ```sh
          CARGO_INSTALL_ROOT="$HOME/.local/share/vfd-lantern/cargo-tools" \
            sh scripts/install-cargo-tools.sh supply-chain
          export PATH="$HOME/.local/share/vfd-lantern/cargo-tools/bin:$PATH"
          ```

          Run the complete gate:

          ```sh
          sh scripts/check-supply-chain.sh
          ```

          It executes `cargo machete`, `cargo deny check`, `cargo audit` and
          `cargo vet check`. The initial locked graph is covered by explicit Cargo Vet
          exemptions, not project audits. A passing check proves policy coverage; it does
          not claim an independent source audit of every dependency. The generated JSON
          report separates audited, imported, exempted and unaudited entries.
          DOC

          export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
          sh scripts/install-cargo-tools.sh supply-chain
          rm -rf supply-chain
          cargo vet init
          cargo vet regenerate exemptions

          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo build --workspace --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
          sh scripts/check-architecture.sh
          CARGO_VET_REPORT=target/supply-chain/cargo-vet-summary-amd64.json \
            sh scripts/check-supply-chain.sh
          grep -q '"cargo_vet": "pass"' target/supply-chain/cargo-vet-summary-amd64.json
          grep -q '"exemptions_are_audits": false' target/supply-chain/cargo-vet-summary-amd64.json
          git diff --check

          git add \
            .github/workflows/ci.yml \
            docs/development/toolchain.md \
            scripts/install-cargo-tools.sh \
            scripts/check-supply-chain.sh \
            supply-chain
          git commit -m "Enforce full supply-chain policy (#2)"
          test "$(git rev-list --count refs/remotes/origin/main..HEAD)" -eq 1
          git push --force-with-lease origin HEAD:"refs/heads/$DELIVERY_BRANCH"

          printf 'Published %s at %s\n' "$DELIVERY_BRANCH" "$(git rev-parse HEAD)"
