name: Stage issue 22 final acceptance

on:
  push:
    branches:
      - agent/issue-22

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-22
          fetch-depth: 0
      - name: Integrate and validate final issue 22 acceptance
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue22_acceptance_stage.rs -o /tmp/issue22-acceptance-stage
          /tmp/issue22-acceptance-stage
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          cargo run --locked -p lantern-sim --example connection_process_acceptance
          sh scripts/check-architecture.sh
          git rm .github/workflows/issue22-acceptance-stage.yml
          git rm .github/scripts/issue22_acceptance_stage.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(#22): close audit and observability acceptance gaps'
          git push origin HEAD:agent/issue-22
