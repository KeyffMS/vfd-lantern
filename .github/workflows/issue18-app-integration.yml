name: Stage issue 18 application integration

on:
  push:
    branches: [agent/issue-18]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-18
          fetch-depth: 0
      - name: Integrate application fault state
        shell: bash
        run: |
          set -euo pipefail

          app=crates/lantern-app/src/application.rs
          perl -0pi -e 's/ConnectionWizardView, Connectivity, MAX_PARAMETER_BROWSER_VISIBLE/ConnectionWizardView, Connectivity, FaultAction, FaultEffect, FaultIdentityContext, FaultTimelineView, FaultTracker, MAX_PARAMETER_BROWSER_VISIBLE/' "$app"
          perl -0pi -e 's/    monitoring: ApplicationMonitoringState,\n    parameters: ApplicationParameterState,\n/    monitoring: ApplicationMonitoringState,\n    parameters: ApplicationParameterState,\n    faults: FaultTracker,\n/' "$app"
          perl -0pi -e 's/            monitoring: ApplicationMonitoringState::default\(\),\n            parameters: ApplicationParameterState::default\(\),\n        \}/            monitoring: ApplicationMonitoringState::default(),\n            parameters: ApplicationParameterState::default(),\n            faults: FaultTracker::default(),\n        }/g' "$app"
          perl -0pi -e 's/            monitoring,\n            parameters,\n        \}/            monitoring,\n            parameters,\n            faults: self.faults.view(),\n        }/' "$app"
          perl -0pi -e 's/            ApplicationAction::Monitoring\(action\) => self\.reduce_monitoring\(action\),\n            ApplicationAction::Parameters\(action\) => self\.reduce_parameters\(action\),/            ApplicationAction::Monitoring(action) => self.reduce_monitoring(action),\n            ApplicationAction::Parameters(action) => self.reduce_parameters(action),\n            ApplicationAction::Faults(action) => self.reduce_faults(action),/' "$app"
          perl -0pi -e 's/(self\.parameters = ApplicationParameterState::default\(\);)/$1\n                    self.faults = FaultTracker::default();/g' "$app"
          perl -0pi -e 's/(self\.parameters = ApplicationParameterState::for_profile\(&profile\);)/$1\n                        self.faults = FaultTracker::default();/' "$app"

          cat > /tmp/reduce_faults.rs <<'RS'
              fn reduce_faults(&mut self, action: FaultAction) -> Vec<ApplicationEffect> {
                  match action {
                      FaultAction::ObserveTelemetry { event, bus } => {
                          let Some(profile) = self.selected_profile() else {
                              return Vec::new();
                          };
                          let identity = match self.session.state() {
                              SessionState::Active(active) => FaultIdentityContext {
                                  session_id: active.session_id,
                                  fingerprint: active.identity.device.fingerprint.clone(),
                                  profile_hash: active.identity.profile_hash.to_hex(),
                              },
                              _ => return Vec::new(),
                          };
                          let latest = self
                              .monitoring
                              .snapshot
                              .as_ref()
                              .map(|snapshot| snapshot.latest.as_ref());
                          match self.faults.observe(&profile, &event, latest, identity, bus) {
                              Ok(Some(detection)) => vec![ApplicationEffect::Faults(
                                  FaultEffect::CaptureFreezeFrame {
                                      event_id: detection.event_id,
                                      session_id: detection.session_id,
                                      parameters: detection.freeze_frame_parameters,
                                  },
                              )],
                              Ok(None) => Vec::new(),
                              Err(error) => {
                                  self.faults.set_error(error.to_string());
                                  Vec::new()
                              }
                          }
                      }
                      FaultAction::FreezeFrameCompleted {
                          event_id,
                          captured,
                          errors,
                      } => {
                          self.faults.complete_freeze_frame(event_id, captured, errors);
                          Vec::new()
                      }
                      FaultAction::Acknowledge(event_id) => {
                          self.faults.acknowledge(event_id);
                          Vec::new()
                      }
                      FaultAction::Export(event_id) => {
                          let active = match self.session.state() {
                              SessionState::Active(active) => active,
                              _ => {
                                  self.faults.set_error(
                                      "fault export requires an active Verified session".to_owned(),
                                  );
                                  return Vec::new();
                              }
                          };
                          let Some(event) = self.faults.export_event(event_id) else {
                              self.faults.set_error("fault event is no longer in the bounded timeline".to_owned());
                              return Vec::new();
                          };
                          if event.event.session_id != active.session_id
                              || event.event.fingerprint != active.identity.device.fingerprint
                              || event.event.profile_hash != active.identity.profile_hash.to_hex()
                          {
                              self.faults.set_error(
                                  "fault export identity does not match the active Verified session"
                                      .to_owned(),
                              );
                              return Vec::new();
                          }
                          let suggested_name = format!(
                              "fault-{}-{}",
                              active.session_id.get(),
                              event_id.get()
                          );
                          vec![ApplicationEffect::Faults(FaultEffect::Export {
                              suggested_name,
                              event,
                          })]
                      }
                      FaultAction::ExportFinished(result) => {
                          self.faults.export_finished(result);
                          Vec::new()
                      }
                  }
              }
          RS
          sed -i 's/^              //' /tmp/reduce_faults.rs
          awk 'BEGIN{done=0} /^    fn reduce_parameters/ && !done { while ((getline line < "/tmp/reduce_faults.rs") > 0) print line; close("/tmp/reduce_faults.rs"); done=1 } {print}' "$app" > /tmp/application.rs
          mv /tmp/application.rs "$app"

          perl -0pi -e 's/pub fn export_finished\(&mut self, result: Result<PathBuf, String>\) \{/pub fn set_error(&mut self, error: String) {\n        self.error = Some(error);\n    }\n\n    pub fn export_finished(&mut self, result: Result<PathBuf, String>) {/' crates/lantern-app/src/faults.rs

          perl -0pi -e 's/    monitoring: MonitoringView,\n    parameters: ParameterBrowserView,\n/    monitoring: MonitoringView,\n    parameters: ParameterBrowserView,\n    faults: FaultTimelineView,\n/' "$app"
          perl -0pi -e 's/            monitoring: MonitoringView::default\(\),\n            parameters: ParameterBrowserView::default\(\),\n/            monitoring: MonitoringView::default(),\n            parameters: ParameterBrowserView::default(),\n            faults: FaultTimelineView::default(),\n/' "$app"
          perl -0pi -e 's/    pub const fn parameters\(&self\) -> &ParameterBrowserView \{\n        &self\.parameters\n    \}\n/    pub const fn parameters(&self) -> &ParameterBrowserView {\n        &self.parameters\n    }\n\n    #[must_use]\n    pub const fn faults(&self) -> &FaultTimelineView {\n        &self.faults\n    }\n/' "$app"
          perl -0pi -e 's/    Parameters\(ParameterAction\),\n    Session\(SessionInput\),/    Parameters(ParameterAction),\n    Faults(FaultAction),\n    Session(SessionInput),/' "$app"
          perl -0pi -e 's/    Monitoring\(MonitoringEffect\),\n    Session\(SessionEffect\),/    Monitoring(MonitoringEffect),\n    Faults(FaultEffect),\n    Session(SessionEffect),/' "$app"

          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test -p lantern-app -p lantern-storage --all-features --locked

          git rm .github/workflows/issue18-app-integration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#18): integrate application fault timeline and export model'
          git push origin HEAD:agent/issue-18
