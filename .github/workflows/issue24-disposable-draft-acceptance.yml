name: Issue 24 disposable draft acceptance

on:
  push:
    branches:
      - agent/issue-24
    paths:
      - '.github/workflows/issue24-disposable-draft-acceptance.yml'
      - 'scripts/release/github-draft-assets.sh'
      - 'crates/lantern-release/**'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  disposable-draft:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Create disposable draft and upload snapshot S
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="issue24-pipeline-test-${GITHUB_RUN_ID}"
          mkdir -p target/disposable/assets
          printf 'amd64 pipeline fixture\ncommit=%s\n' "$GITHUB_SHA" > target/disposable/assets/product-amd64.txt
          printf 'arm64 pipeline fixture\ncommit=%s\n' "$GITHUB_SHA" > target/disposable/assets/product-arm64.txt
          printf '{"schema_version":1,"status":"passed","run_id":%s}\n' "$GITHUB_RUN_ID" > target/disposable/assets/package-gate.json
          release=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Issue 24 pipeline test $GITHUB_RUN_ID" \
            -f body='Disposable #24 release infrastructure acceptance. Not a product release.' \
            -F draft=true \
            -F prerelease=true)
          release_id=$(printf '%s' "$release" | jq -r '.id')
          test -n "$release_id"
          test "$release_id" != null
          printf '%s\n' "$release_id" > "$RUNNER_TEMP/issue24-release-id"
          printf '%s\n' "$tag" > "$RUNNER_TEMP/issue24-tag"
          sh scripts/release/github-draft-assets.sh upload-dir "$release_id" target/disposable/assets
          test "$(sh scripts/release/github-draft-assets.sh count "$release_id")" -eq 3
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Freeze S and create CandidateManifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          hash=$(cargo run --locked -q -p lantern-release --example candidate_manifest -- \
            snapshot \
            --asset-dir target/disposable/assets \
            --commit "$GITHUB_SHA" \
            --version 0.0.0-pipeline-test \
            --draft-release-id "${{ steps.draft.outputs.release_id }}" \
            --toolchain 'rustc 1.97.1' \
            --image-digest 'sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132' \
            --workflow-revision issue24-disposable-draft-v1 \
            --attestation-id "workflow-run:${GITHUB_RUN_ID}" \
            --gate package-test=passed \
            --output target/disposable/assets/candidate-manifest-v1.json)
          test -n "$hash"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Upload manifest as sole post-snapshot asset and verify exact set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ steps.draft.outputs.release_id }}"
          before=$(sh scripts/release/github-draft-assets.sh count "$release_id")
          test "$before" -eq 3
          sh scripts/release/github-draft-assets.sh upload "$release_id" target/disposable/assets/candidate-manifest-v1.json
          after=$(sh scripts/release/github-draft-assets.sh count "$release_id")
          test "$after" -eq 4
          sh scripts/release/github-draft-assets.sh download-all "$release_id" target/redownloaded
          cargo run --locked -q -p lantern-release --example candidate_manifest -- \
            verify \
            --asset-dir target/redownloaded \
            --manifest target/redownloaded/candidate-manifest-v1.json \
            --expected-manifest-sha256 "${{ steps.manifest.outputs.sha256 }}"

      - name: Attest CandidateManifest
        id: attest-manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/disposable/assets/candidate-manifest-v1.json
          show-summary: true

      - name: Verify attestation output
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.attest-manifest.outputs.attestation-id }}"
          test -n "${{ steps.attest-manifest.outputs.attestation-url }}"

      - name: Prove post-freeze mutation invalidates approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ steps.draft.outputs.release_id }}"
          printf 'forbidden post-freeze mutation\n' > target/unexpected-after-freeze.txt
          sh scripts/release/github-draft-assets.sh upload "$release_id" target/unexpected-after-freeze.txt
          sh scripts/release/github-draft-assets.sh download-all "$release_id" target/mutated
          if cargo run --locked -q -p lantern-release --example candidate_manifest -- \
            verify \
            --asset-dir target/mutated \
            --manifest target/mutated/candidate-manifest-v1.json \
            --expected-manifest-sha256 "${{ steps.manifest.outputs.sha256 }}"
          then
            echo 'post-freeze mutation unexpectedly remained valid' >&2
            exit 1
          fi
          echo 'post-freeze mutation correctly invalidated approval'

      - name: Cleanup disposable release and tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/issue24-release-id" ]; then
            release_id=$(cat "$RUNNER_TEMP/issue24-release-id")
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1 || true
          fi
          if [ -f "$RUNNER_TEMP/issue24-tag" ]; then
            tag=$(cat "$RUNNER_TEMP/issue24-tag")
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
          fi
