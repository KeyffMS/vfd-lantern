name: Stage issue 23 adapter fail closed

on:
  push:
    branches:
      - agent/issue-23
    paths:
      - '.github/scripts/issue23_adapter_fail_closed_stage.rs'
      - '.github/workflows/issue23-adapter-fail-closed-stage.yml'
      - 'crates/vfd-lantern/**'
      - 'crates/lantern-app/**'
      - 'scripts/check-architecture.sh'

permissions:
  contents: write

jobs:
  fail-closed:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-23
          fetch-depth: 0
      - name: Integrate and validate fail-closed adapter composition
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue23_adapter_fail_closed_stage.rs -o /tmp/issue23-adapter-fail-closed-stage
          /tmp/issue23-adapter-fail-closed-stage
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          git rm .github/workflows/issue23-adapter-fail-closed-stage.yml
          git rm .github/scripts/issue23_adapter_fail_closed_stage.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(#23): prove write adapters fail closed in production composition'
          git push origin HEAD:agent/issue-23
