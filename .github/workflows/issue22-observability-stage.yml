name: Stage issue 22 observability

on:
  push:
    branches:
      - agent/issue-22

permissions:
  contents: write

jobs:
  observability:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-22
          fetch-depth: 0
      - name: Integrate and validate observability
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue22_observability_stage.rs -o /tmp/issue22-observability-stage
          /tmp/issue22-observability-stage
          cargo fmt --all
          cargo check --workspace --all-features
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          git rm .github/workflows/issue22-observability-stage.yml
          git rm .github/scripts/issue22_observability_stage.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#22): add bounded redacted diagnostics logging'
          git push origin HEAD:agent/issue-22
