name: Stage issue 19 CSV core v2

on:
  push:
    branches: [agent/issue-19]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-19
          fetch-depth: 0
      - name: Integrate CSV core with follow-up fixes
        shell: bash
        run: |
          set -euo pipefail

          awk 'seen { sub(/^          /, ""); print } /^        run: \|$/ { seen=1; next }' \
            .github/workflows/issue19-core-stage.yml > /tmp/issue19-base.sh
          split_line="$(grep -n '^cargo fmt --all$' /tmp/issue19-base.sh | cut -d: -f1)"
          test -n "$split_line"
          head -n "$((split_line - 1))" /tmp/issue19-base.sh > /tmp/issue19-pre.sh
          tail -n "+$split_line" /tmp/issue19-base.sh > /tmp/issue19-post.sh

          bash /tmp/issue19-pre.sh

          sim=crates/lantern-sim/tests/telemetry_pipeline.rs
          perl -0pi -e 's/next_parameter_event\(&mut consumers\.csv,/next_parameter_event(\&mut consumers.diagnostics,/g' "$sim"
          test "$(grep -c 'next_parameter_event(&mut consumers.diagnostics,' "$sim")" -eq 3

          writer=crates/lantern-storage/src/csv_writer.rs
          perl -0pi -e 's/Start\(CsvWriterStart, oneshot::Sender<Result<\(\), String>>\)/Start(Box<CsvWriterStart>, oneshot::Sender<Result<(), String>>)/' "$writer"
          perl -0pi -e 's/Stop\(CsvWriterStop, oneshot::Sender<Result<\(\), String>>\)/Stop(Box<CsvWriterStop>, oneshot::Sender<Result<(), String>>)/' "$writer"
          perl -0pi -e 's/CsvWriterCommand::Start\(request, reply_tx\)/CsvWriterCommand::Start(Box::new(request), reply_tx)/' "$writer"
          perl -0pi -e 's/CsvWriterCommand::Stop\(request, reply_tx\)/CsvWriterCommand::Stop(Box::new(request), reply_tx)/' "$writer"
          perl -0pi -e 's/start_logger\(request\)/start_logger(*request)/' "$writer"
          perl -0pi -e 's/finalize_logger\(&mut logger, request\)/finalize_logger(\&mut logger, *request)/' "$writer"
          grep -F 'Start(Box<CsvWriterStart>' "$writer"
          grep -F 'Stop(Box<CsvWriterStop>' "$writer"
          grep -F 'CsvWriterCommand::Start(Box::new(request), reply_tx)' "$writer"
          grep -F 'CsvWriterCommand::Stop(Box::new(request), reply_tx)' "$writer"
          grep -F 'start_logger(*request)' "$writer"
          grep -F 'finalize_logger(&mut logger, *request)' "$writer"

          sed -i '/^git rm .github\/workflows\/issue19-core-stage.yml$/a git rm .github/workflows/issue19-core-stage-v2.yml' /tmp/issue19-post.sh
          { echo 'set -euo pipefail'; cat /tmp/issue19-post.sh; } > /tmp/issue19-post-strict.sh
          bash /tmp/issue19-post-strict.sh
