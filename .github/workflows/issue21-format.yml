name: Issue 21 development formatting
on:
  push:
    branches: [agent/issue-21]
permissions:
  contents: read
concurrency:
  group: issue21-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export pinned formatter patch for development checkout
        run: |
          set -eu
          cargo fmt --all
          rustfmt --edition 2024 crates/lantern-app/src/write_coordinator_restore_tests.rs
          echo FORMAT_PATCH_BEGIN
          git diff --binary | base64 -w0
          echo
          echo FORMAT_PATCH_END
