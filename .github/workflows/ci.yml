name: Clean issue 4 staging files

on:
  pull_request:
    branches: ["agent/issues-1-9"]

permissions:
  contents: write

concurrency:
  group: clean-issue-4
  cancel-in-progress: true

jobs:
  clean:
    if: github.head_ref == 'agent/issue-4-work'
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Install Git and certificates
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git
      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-4-work
      - name: Remove staging files
        run: |
          rm -f .github/issue4.bundle.* .github/issue4.trigger
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Remove issue 4 staging files" || exit 0
          git push origin HEAD:agent/issue-4-work
