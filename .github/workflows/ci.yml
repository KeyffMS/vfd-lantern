name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Debian 13 / Rust 1.97.1 / amd64
    # Fork code requires maintainer review before dispatch to a persistent runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-quality.yml
    with:
      commit: ${{ github.sha }}
