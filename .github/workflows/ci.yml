name: Apply reviewed TOML API correction

on:
  pull_request:
    branches: ["agent/issues-1-9"]

permissions:
  contents: write

concurrency:
  group: correct-issue-4-toml
  cancel-in-progress: true

jobs:
  correct:
    if: github.head_ref == 'agent/issue-4-work'
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git perl rustup
      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-4-work
      - name: Apply correction and format
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          perl -0pi -e 's/            let deserializer = toml::Deserializer::new\(source\);\n/            let deserializer = toml::Deserializer::parse(source).map_err(|error| {\n                ProfileError::Parse {\n                    format,\n                    path: "<document>".to_owned(),\n                    message: error.to_string(),\n                }\n            })?;\n/' crates/lantern-profile/src/lib.rs
          cargo fmt --all
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/lantern-profile/src/lib.rs
          git commit -m "Handle TOML parser construction errors"
          git push origin HEAD:agent/issue-4-work
