name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian-trixie:
    name: Debian 13 / Rust 1.97.1
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            libudev-dev \
            pkg-config \
            rustup

      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1

      - name: Apply canonical Rust formatting once
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "Apply rustfmt"
            branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            git push origin "HEAD:${branch}"
          fi

      - name: Validate lockfile and metadata
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check architecture boundaries
        run: sh scripts/check-architecture.sh
