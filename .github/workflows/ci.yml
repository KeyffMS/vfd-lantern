name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-clippy-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Apply isolated #14 Clippy fix
    runs-on: [self-hosted]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply exact fix and restore standard CI
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout --force --detach "refs/remotes/origin/${GITHUB_HEAD_REF}"
          sed -i 's/, SessionPhaseView//' crates/lantern-tui/src/screens.rs
          git show refs/remotes/origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/lantern-tui/src/screens.rs .github/workflows/ci.yml
          git commit -m 'fix(#14): remove unused Scope screen import'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
