name: Apply reviewed #3 correction

on:
  push:
    branches: ["agent/issue-3-work"]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends git rustup ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-3-work
      - run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          sed -i '131s/ as i64$//' crates/lantern-domain/src/codec.rs
          cargo fmt --all
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/lantern-domain/src/codec.rs
          git commit -m "Remove redundant signed cast" || exit 0
          git push origin HEAD:agent/issue-3-work
