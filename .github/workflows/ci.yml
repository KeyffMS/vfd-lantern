name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-rtu-expectation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Apply #14 RTU expectation
    runs-on: [self-hosted]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply exact expectation and restore standard CI
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout --force --detach "refs/remotes/origin/${GITHUB_HEAD_REF}"
          sed -n '698p' crates/lantern-sim/tests/rtu_stack.rs | grep -q 'vec!\[SessionEffect::ClosePort\]'
          sed -i '698s/vec!\[SessionEffect::ClosePort\]/vec![SessionEffect::StopPlanner, SessionEffect::ClosePort]/' crates/lantern-sim/tests/rtu_stack.rs
          git show refs/remotes/origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/lantern-sim/tests/rtu_stack.rs .github/workflows/ci.yml
          git commit -m 'test(#14): expect planner stop in RTU identity change'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
