name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-final-clippy-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Apply #14 final Clippy fix
    runs-on: [self-hosted]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply exact test import fix
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git checkout --force --detach "refs/remotes/origin/${GITHUB_HEAD_REF}"
          grep -q 'AxisKey, MonitoringError, ScopePanel, ScopeSelection' crates/lantern-app/src/monitoring.rs
          sed -i 's/AxisKey, MonitoringError, ScopePanel, ScopeSelection/AxisKey, MonitoringError, ScopeSelection/' crates/lantern-app/src/monitoring.rs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/lantern-app/src/monitoring.rs
          git commit -m 'test(#14): remove stale ScopePanel import'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
