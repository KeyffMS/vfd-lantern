name: Refresh lockfile for issue 3

on:
  push:
    branches: ["agent/issue-3-work"]

permissions:
  contents: write

concurrency:
  group: refresh-lock-issue-3
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git rustup
      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-3-work
      - name: Install Rust and refresh lockfile
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          cargo generate-lockfile
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git commit -m "Refresh Cargo.lock after feature cleanup"
            git push origin HEAD:agent/issue-3-work
          fi
