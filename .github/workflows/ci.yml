name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Apply #14 acceptance rustfmt
    runs-on: [self-hosted]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Format exact PR head and restore standard CI
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout --force --detach "refs/remotes/origin/${GITHUB_HEAD_REF}"
          cargo fmt --all
          git show refs/remotes/origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs' .github/workflows/ci.yml
          git commit -m 'style(#14): format monitoring acceptance tests'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
