name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Debian 13 / Rust 1.97.1 / amd64
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Verify runner platform
        run: |
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "debian"
          test "${VERSION_ID%%.*}" = "13"
          printf 'runner=%s os=%s %s arch=%s\n' "$RUNNER_NAME" "$NAME" "$VERSION_ID" "$(uname -m)"

      - name: Install system dependencies
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install --yes --no-install-recommends \
              build-essential \
              ca-certificates \
              git \
              libssl-dev \
              libudev-dev \
              pkg-config \
              rustup
          else
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              build-essential \
              ca-certificates \
              git \
              libssl-dev \
              libudev-dev \
              pkg-config \
              rustup
          fi

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Install pinned supply-chain tools
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/vfd-lantern-cargo-tools
        run: sh scripts/install-cargo-tools.sh supply-chain

      - name: Validate lockfile and metadata
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Check architecture boundaries
        run: sh scripts/check-architecture.sh

      - name: Check supply chain
        env:
          CARGO_VET_REPORT: target/supply-chain/cargo-vet-summary-amd64.json
        run: sh scripts/check-supply-chain.sh

      - name: Upload supply-chain report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-amd64
          path: target/supply-chain
          if-no-files-found: warn
          retention-days: 14
