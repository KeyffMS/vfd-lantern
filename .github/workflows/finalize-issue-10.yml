name: Finalize verified issue 10

on:
  push:
    branches:
      - agent/issue-10-publisher

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-issue-10
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    env:
      DELIVERY_BRANCH: agent/issue-10
      RUSTDOCFLAGS: -D warnings
      CARGO_VET_REPORT: /tmp/issue-10-finalizer/cargo-vet-summary.json
      EVIDENCE: /tmp/issue-10-finalizer
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git jq libssl-dev libudev-dev \
            pkg-config rustup

      - name: Check out publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-10-publisher
          fetch-depth: 0

      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'stage=start\n' > "$EVIDENCE/state.txt"
          body="<!-- issue-10-finalizer:start:${GITHUB_RUN_ID} -->
          ## Finalizacja #10 uruchomiona

          Przebieg: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Źródłem kandydata jest wyłącznie wersjonowany payload z manifestem na \`agent/issue-10-publisher\`. Finalizer weryfikuje SHA-256 patcha, Git blob SHA każdej części, bazowy commit, oczekiwane tree, pełny gate Debiana 13 / Rust 1.97.1, standardowy CI amd64/arm64 i CI dokładnego merge commita."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Verify manifest and reconstruct exact candidate
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=manifest\n' > "$EVIDENCE/state.txt"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          manifest=.issue10-publisher/manifest.json
          test -s "$manifest"
          jq -e 'type == "object"' "$manifest" >/dev/null
          jq -e '.base_sha | type == "string" and length == 40' "$manifest" >/dev/null
          jq -e '(.expected_tree_sha // .candidate_tree_sha) | type == "string" and length == 40' "$manifest" >/dev/null
          jq -e '.patch_sha256 | type == "string" and length == 64' "$manifest" >/dev/null
          jq -e '.parts | type == "array" and length > 0' "$manifest" >/dev/null

          cp "$manifest" "$EVIDENCE/manifest.json"
          base_sha=$(jq -r .base_sha "$manifest")
          expected_tree=$(jq -r '.expected_tree_sha // .candidate_tree_sha' "$manifest")
          expected_patch_sha=$(jq -r .patch_sha256 "$manifest")
          commit_message=$(jq -r '.commit_message // "Implement deterministic PollPlanner and bounded polling executor (#10)"' "$manifest")

          : > /tmp/issue10-payload.txt
          jq -c '.parts[]' "$manifest" | while IFS= read -r part; do
            path=$(jq -r .path <<<"$part")
            expected_bytes=$(jq -r '.bytes // empty' <<<"$part")
            expected_sha=$(jq -r .sha256 <<<"$part")
            expected_blob=$(jq -r '.git_blob_sha // .blob_sha' <<<"$part")

            case "$path" in
              .issue10-publisher/part-*) ;;
              *) printf 'invalid payload path: %s\n' "$path" >&2; exit 1 ;;
            esac
            test -f "$path"
            test "$(git hash-object "$path")" = "$expected_blob"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha"
            if [ -n "$expected_bytes" ]; then
              test "$(wc -c < "$path" | tr -d ' ')" = "$expected_bytes"
            fi
            cat "$path" >> /tmp/issue10-payload.txt
          done

          tr -d '\r\n' < /tmp/issue10-payload.txt > /tmp/issue10-payload.compact
          if head -c 16 /tmp/issue10-payload.compact | grep -q '^diff --git '; then
            cp /tmp/issue10-payload.compact /tmp/issue10.patch
          else
            base64 --decode /tmp/issue10-payload.compact > /tmp/issue10.patch
          fi

          test -s /tmp/issue10.patch
          test "$(sha256sum /tmp/issue10.patch | awk '{print $1}')" = "$expected_patch_sha"
          grep -q '^diff --git ' /tmp/issue10.patch
          grep -q 'pub struct PollPlanner' /tmp/issue10.patch
          grep -q 'pub struct PollExecutor' /tmp/issue10.patch
          sha256sum /tmp/issue10.patch | tee "$EVIDENCE/patch.sha256"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$base_sha"
          git reset --hard origin/main
          git clean -fdx
          printf 'stage=apply\n' > "$EVIDENCE/state.txt"

          git apply --check --whitespace=error-all /tmp/issue10.patch
          git apply --index --whitespace=error-all /tmp/issue10.patch
          git diff --cached --check

          test -f crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollPlanner' crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollExecutor' crates/lantern-app/src/poll.rs
          grep -q 'MonotonicClock' crates/lantern-app/src/poll.rs
          test "$(git write-tree)" = "$expected_tree"

          git diff --cached --name-only | tee "$EVIDENCE/changed-files.txt"
          test "$(wc -l < "$EVIDENCE/changed-files.txt" | tr -d ' ')" -le 24
          while IFS= read -r path; do
            case "$path" in
              Cargo.lock|crates/lantern-app/*|crates/lantern-sim/*) ;;
              *) printf 'forbidden issue #10 path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < "$EVIDENCE/changed-files.txt"

          test ! -e .issue10-publisher
          test ! -e .github/workflows/finalize-issue-10.yml
          test ! -e .github/workflows/publish-issue-10-candidate.yml
          ! grep -R --line-number --fixed-strings 'paste.rs' . --exclude-dir=.git

          printf 'base_sha=%s\n' "$base_sha" | tee "$EVIDENCE/identity.txt"
          printf 'expected_tree=%s\n' "$expected_tree" | tee -a "$EVIDENCE/identity.txt"
          printf 'actual_tree=%s\n' "$(git write-tree)" | tee -a "$EVIDENCE/identity.txt"
          printf 'patch_sha256=%s\n' "$expected_patch_sha" | tee -a "$EVIDENCE/identity.txt"
          printf 'commit_message=%s\n' "$commit_message" | tee -a "$EVIDENCE/identity.txt"
          git diff --cached --stat | tee "$EVIDENCE/diff-stat.txt"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "expected_tree=$expected_tree" >> "$GITHUB_OUTPUT"
          echo "commit_message=$commit_message" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust and supply-chain tools
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/vfd-lantern-cargo-tools
        run: |
          printf 'stage=toolchain\n' > "$EVIDENCE/state.txt"
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version | tee "$EVIDENCE/rust-version.txt"
          cargo --version | tee "$EVIDENCE/cargo-version.txt"
          sh scripts/install-cargo-tools.sh supply-chain

      - name: Run complete candidate gate
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=gate\n' > "$EVIDENCE/state.txt"
          exec > >(tee "$EVIDENCE/gate.log") 2>&1

          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo build --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked -- --test-threads=1
          cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          sh scripts/check-supply-chain.sh
          git diff --cached --check
          git diff --check

          cargo run --release -p lantern-app --example poll_planner_benchmark \
            | tee "$EVIDENCE/benchmark.txt"
          grep -q 'parameters=20000' "$EVIDENCE/benchmark.txt"
          grep -q 'blocks=160' "$EVIDENCE/benchmark.txt"
          grep -q 'rejections=0' "$EVIDENCE/benchmark.txt"
          test "$(git rev-parse origin/main)" = "${{ steps.reconstruct.outputs.base_sha }}"
          test "$(git write-tree)" = "${{ steps.reconstruct.outputs.expected_tree }}"

      - name: Publish one logical commit
        id: publish
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.reconstruct.outputs.commit_message }}
          BASE_SHA: ${{ steps.reconstruct.outputs.base_sha }}
          EXPECTED_TREE: ${{ steps.reconstruct.outputs.expected_tree }}
        run: |
          set -euo pipefail
          printf 'stage=publish\n' > "$EVIDENCE/state.txt"
          git config user.name 'VFD Lantern contributors'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"

          candidate_sha=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count origin/main..HEAD)" = 1
          test "$candidate_tree" = "$EXPECTED_TREE"
          git push --force origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          printf 'candidate_sha=%s\n' "$candidate_sha" | tee -a "$EVIDENCE/identity.txt"
          printf 'candidate_tree=%s\n' "$candidate_tree" | tee -a "$EVIDENCE/identity.txt"
          printf 'commits_over_main=1\n' | tee -a "$EVIDENCE/identity.txt"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Create PR and wait for exact PR CI
        id: pr_ci
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.reconstruct.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=pr-ci\n' > "$EVIDENCE/state.txt"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          existing=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$api/pulls?state=open&head=KeyffMS%3Aagent%2Fissue-10&base=main")
          pr=$(jq -r '.[0].number // empty' <<<"$existing")
          if [ -z "$pr" ]; then
            body=$(cat <<'EOF'
          ## Zakres

          Implementuje deterministyczny `PollPlanner` i ograniczony `PollExecutor`.

          - deduplikacja i grupowanie bloków z limitami profilu/Modbus;
          - zamknięta polityka klas kolejki — producer nie może nadać `SafetyOneShot`;
          - koszt RTU i limit cykliczny 70%;
          - deterministyczna degradacja i jawne odrzucenia;
          - niezmienny, wersjonowany `PollPlan`;
          - deadline-before-send, bounded backlog i brak catch-up burstu;
          - wspólny `MonotonicClock`;
          - test przez `BusActor`, Modbus RTU i PTY z #20;
          - benchmark maksymalnego profilu.

          Closes #10
          EOF
            )
            payload=$(jq -n --arg title 'Implement deterministic PollPlanner and bounded polling executor (#10)' --arg head "$DELIVERY_BRANCH" --arg base main --arg body "$body" '{title:$title,head:$head,base:$base,body:$body,draft:false,maintainer_can_modify:true}')
            created=$(curl --fail-with-body --silent --show-error --request POST "${auth[@]}" "$api/pulls" --data "$payload")
            pr=$(jq -r .number <<<"$created")
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          printf 'pr=%s\n' "$pr" | tee "$EVIDENCE/pr.txt"

          candidate_comment=$(jq -n --arg body "<!-- issue-10-candidate:$CANDIDATE_SHA -->
          ## Kandydat #10 opublikowany

          - PR: #$pr
          - head: \`$CANDIDATE_SHA\`
          - parent: \`$BASE_SHA\`
          - pełny gate wydawcy: **PASS**
          - commitów względem main: **1**

          Oczekiwanie na standardowy CI Debiana 13 na amd64 i natywnym arm64." '{body:$body}')
          curl --fail-with-body --silent --show-error --request POST "${auth[@]}" "$api/issues/10/comments" --data "$candidate_comment" >/dev/null

          deadline=$((SECONDS + 5400))
          ci_run=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            pr_state=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/pulls/$pr")
            test "$(jq -r .head.sha <<<"$pr_state")" = "$CANDIDATE_SHA"
            runs=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs?head_sha=$CANDIDATE_SHA&per_page=50")
            for run_id in $(jq -r '.workflow_runs[] | select(.name == "CI" and .status == "completed") | .id' <<<"$runs"); do
              run=$(jq -c --argjson id "$run_id" '.workflow_runs[] | select(.id == $id)' <<<"$runs")
              jobs=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")
              amd=$(jq '[.jobs[] | select(.name | test("amd64"))] | length' <<<"$jobs")
              arm=$(jq '[.jobs[] | select(.name | test("arm64"))] | length' <<<"$jobs")
              bad=$(jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length' <<<"$jobs")
              if [ "$amd" -gt 0 ] && [ "$arm" -gt 0 ] && [ "$bad" -eq 0 ] && [ "$(jq -r .conclusion <<<"$run")" = success ]; then
                ci_run=$run_id
                printf '%s\n' "$jobs" > "$EVIDENCE/pr-ci-jobs.json"
                printf '%s\n' "$run" > "$EVIDENCE/pr-ci-run.json"
                break 2
              fi
            done
            sleep 20
          done
          test -n "$ci_run"
          echo "ci_run=$ci_run" >> "$GITHUB_OUTPUT"

      - name: Merge exact SHA and wait for main CI
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          PR_NUMBER: ${{ steps.pr_ci.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=merge-main-ci\n' > "$EVIDENCE/state.txt"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          pr_state=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/pulls/$PR_NUMBER")
          test "$(jq -r .head.sha <<<"$pr_state")" = "$CANDIDATE_SHA"
          payload=$(jq -n --arg sha "$CANDIDATE_SHA" --arg title "Merge PR #$PR_NUMBER: deterministic PollPlanner and bounded polling executor" --arg message 'Closes #10 and unblocks TelemetryPipeline work in #11.' '{sha:$sha,merge_method:"merge",commit_title:$title,commit_message:$message}')
          merged=$(curl --fail-with-body --silent --show-error --request PUT "${auth[@]}" "$api/pulls/$PR_NUMBER/merge" --data "$payload")
          test "$(jq -r .merged <<<"$merged")" = true
          merge_sha=$(jq -r .sha <<<"$merged")
          printf '%s\n' "$merged" > "$EVIDENCE/merge.json"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

          deadline=$((SECONDS + 5400))
          main_run=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            current=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/branches/main" | jq -r .commit.sha)
            runs=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs?head_sha=$merge_sha&event=push&per_page=30")
            if [ "$current" = "$merge_sha" ]; then
              for run_id in $(jq -r '.workflow_runs[] | select(.name == "CI" and .status == "completed") | .id' <<<"$runs"); do
                run=$(jq -c --argjson id "$run_id" '.workflow_runs[] | select(.id == $id)' <<<"$runs")
                jobs=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")
                amd=$(jq '[.jobs[] | select(.name | test("amd64"))] | length' <<<"$jobs")
                arm=$(jq '[.jobs[] | select(.name | test("arm64"))] | length' <<<"$jobs")
                bad=$(jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length' <<<"$jobs")
                if [ "$amd" -gt 0 ] && [ "$arm" -gt 0 ] && [ "$bad" -eq 0 ] && [ "$(jq -r .conclusion <<<"$run")" = success ]; then
                  main_run=$run_id
                  printf '%s\n' "$jobs" > "$EVIDENCE/main-ci-jobs.json"
                  printf '%s\n' "$run" > "$EVIDENCE/main-ci-run.json"
                  break 2
                fi
              done
            fi
            sleep 20
          done
          test -n "$main_run"
          echo "main_run=$main_run" >> "$GITHUB_OUTPUT"

      - name: Register acceptance and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.pr_ci.outputs.pr }}
          PR_CI_RUN: ${{ steps.pr_ci.outputs.ci_run }}
          MAIN_CI_RUN: ${{ steps.merge.outputs.main_run }}
          EXPECTED_TREE: ${{ steps.reconstruct.outputs.expected_tree }}
          BASE_SHA: ${{ steps.reconstruct.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=register\n' > "$EVIDENCE/state.txt"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          benchmark=$(tr '\n' '; ' < "$EVIDENCE/benchmark.txt")
          changed=$(sed 's/^/- `/' "$EVIDENCE/changed-files.txt" | sed 's/$/`/' | head -40)

          body=$(cat <<EOF
          <!-- issue-10-acceptance:$MERGE_SHA -->
          ## Odbiór końcowy #10 — PASS

          ### Tożsamość

          - PR: #$PR_NUMBER
          - base SHA: \`$BASE_SHA\`
          - candidate SHA: \`$CANDIDATE_SHA\`
          - candidate tree: \`$EXPECTED_TREE\`
          - merge SHA: \`$MERGE_SHA\`
          - commitów względem base: **1**

          ### Bramki

          - pełny gate Debiana 13 / Rust 1.97.1: **PASS**
          - standardowy CI PR amd64: **PASS**
          - standardowy CI PR native arm64: **PASS**
          - standardowy CI merge commita amd64: **PASS**
          - standardowy CI merge commita native arm64: **PASS**
          - \`cargo machete\`, \`cargo deny check\`, \`cargo audit\`, \`cargo vet check\`: **PASS**
          - architektura i rustdoc \`-D warnings\`: **PASS**
          - test \`PollPlanner → PollExecutor → BusActor → Modbus RTU → PTY\`: **PASS**
          - write count: **0**
          - PR CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$PR_CI_RUN
          - main CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$MAIN_CI_RUN

          ### Benchmark

          \`$benchmark\`

          ### Zmienione pliki

          $changed

          Kryteria #10 są spełnione. #11 może rozpocząć implementację na dokładnym merge commitcie \`$MERGE_SHA\`.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error --request POST "${auth[@]}" "$api/issues/10/comments" --data "$payload" >/dev/null
          curl --fail-with-body --silent --show-error --request PATCH "${auth[@]}" "$api/issues/10" --data '{"state":"closed","state_reason":"completed"}' >/dev/null

          unlock=$(jq -n --arg body "<!-- issue-11-unblocked:$MERGE_SHA -->
          ## #11 odblokowane przez zakończenie #10

          PollPlanner i bounded PollExecutor zostały scalone przez PR #$PR_NUMBER. Bazą implementacji TelemetryPipeline jest merge commit \`$MERGE_SHA\`. #11 musi używać istniejących \`PollPlan\`, \`PollExecutor\` i wspólnego \`MonotonicClock\`; nie tworzy własnego harmonogramu ani drugiego harnessu RTU." '{body:$body}')
          curl --fail-with-body --silent --show-error --request POST "${auth[@]}" "$api/issues/11/comments" --data "$unlock" >/dev/null

          roadmap=$(jq -n --arg body "<!-- roadmap-issue10-complete:$MERGE_SHA -->
          ## M2 — #10 zakończone

          #10 zostało scalone przez PR #$PR_NUMBER jako \`$MERGE_SHA\` po zielonym CI amd64/arm64 na kandydacie i merge commitcie. Następny element ścieżki krytycznej: #11 TelemetryPipeline." '{body:$body}')
          curl --fail-with-body --silent --show-error --request POST "${auth[@]}" "$api/issues/26/comments" --data "$roadmap" >/dev/null
          printf 'stage=complete\n' > "$EVIDENCE/state.txt"

      - name: Record fail-closed outcome
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stage=$(sed -n 's/^stage=//p' "$EVIDENCE/state.txt" 2>/dev/null || printf unknown)
          body="<!-- issue-10-finalizer:failure:${GITHUB_RUN_ID} -->
          ## Finalizacja #10 — FAIL-CLOSED

          Przebieg: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Zatrzymana bramka: \`$stage\`.
          Issue pozostaje otwarte i #11 nie jest uznane za odblokowane."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Upload finalizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-10-finalizer-evidence
          path: /tmp/issue-10-finalizer
          if-no-files-found: warn
          retention-days: 14
