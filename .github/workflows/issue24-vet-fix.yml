name: Issue 24 cargo-vet fix

on:
  push:
    branches:
      - agent/issue-24
    paths:
      - '.github/workflows/issue24-vet-fix.yml'

permissions:
  contents: write

jobs:
  vet-fix:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-24
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact safe-to-run exemptions for release documentation tooling
        shell: bash
        run: |
          set -euo pipefail
          file=supply-chain/config.toml
          append_exemption() {
            crate=$1
            version=$2
            if grep -A2 -F "[[exemptions.$crate]]" "$file" | grep -Fq "version = \"$version\""; then
              return
            fi
            cat >> "$file" <<EOF

[[exemptions.$crate]]
version = "$version"
criteria = "safe-to-run"
EOF
          }
          append_exemption clap_complete 4.6.0
          append_exemption clap_mangen 0.2.29
          append_exemption roff 0.2.2

      - name: Verify cargo-vet and full supply-chain gate
        run: |
          export CARGO_INSTALL_ROOT="$HOME/.cache/vfd-lantern-cargo-tools"
          export CARGO_TARGET_DIR="$HOME/.cache/vfd-lantern-cargo-install-target"
          sh scripts/install-cargo-tools.sh supply-chain
          export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
          cargo vet check
          CARGO_VET_REPORT=target/supply-chain/cargo-vet-summary-issue24-fixed.json sh scripts/check-supply-chain.sh

      - name: Commit supply-chain policy update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supply-chain/config.toml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supply-chain/config.toml
          git commit -m 'chore(#24): vet release documentation dependencies'
          git fetch origin agent/issue-24
          git rebase origin/agent/issue-24
          git push origin HEAD:agent/issue-24
