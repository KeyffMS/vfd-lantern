name: Export Rust 1.97.1 toolchain

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install exact toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Package relocatable toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup toolchain list -v | awk '$1 ~ /^1\.97\.1-/ {print $2; exit}')"
          test -d "$toolchain"
          tar -C "$(dirname "$toolchain")" -czf /tmp/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz "$(basename "$toolchain")"
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.97.1-x86_64-unknown-linux-gnu
          path: /tmp/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
