name: Issue 24 staging

on:
  push:
    branches:
      - agent/issue-24
    paths:
      - '.github/workflows/issue24-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Verify runner
        run: |
          test "$RUNNER_NAME" = "vfd-lantern-podman-01"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-24
          persist-credentials: true
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Resolve lockfile and check all targets
        run: cargo check --workspace --all-targets --all-features
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run release contract tests
        run: cargo test -p lantern-release
      - name: Persist generated lockfile and rustfmt normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/lantern-release crates/vfd-lantern
          git commit -m "chore(#24): normalize release staging inputs"
          git push origin HEAD:agent/issue-24
