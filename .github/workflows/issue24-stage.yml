name: Issue 24 staging

on:
  push:
    branches:
      - agent/issue-24
    paths:
      - '.github/workflows/issue24-stage.yml'
      - '.github/workflows/release-candidate-build.yml'
      - '.github/workflows/release-candidate-finalize.yml'
      - '.github/workflows/release-publish.yml'
      - 'crates/lantern-release/**'
      - 'scripts/release/**'

permissions:
  contents: read

jobs:
  stage:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Verify runner
        run: |
          test "$RUNNER_NAME" = "vfd-lantern-podman-01"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-24
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Validate lockfile and workspace
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run release contract tests
        run: cargo test --locked -p lantern-release

      - name: Run candidate snapshot/finalizer/publish dry-run
        run: sh scripts/release/dry-run-candidate.sh

      - name: Validate workflow safety boundaries
        run: |
          set -eu
          grep -Fq 'dry_run' .github/workflows/release-candidate-build.yml
          grep -Fq 'dry_run' .github/workflows/release-candidate-finalize.yml
          grep -Fq 'dry_run' .github/workflows/release-publish.yml
          grep -Fq 'same GitHub draft' .github/workflows/release-publish.yml
          ! grep -R -E '^ *on:.*(tag|release)' .github/workflows/release-*.yml
