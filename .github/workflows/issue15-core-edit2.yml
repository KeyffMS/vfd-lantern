name: Apply issue 15 validated core changes v2

on:
  push:
    branches: [agent/issue-15]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-15
          fetch-depth: 0
      - name: Apply core changes
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/codec-getters <<'EOF'
              /// Returns the validated register encoding.
              #[must_use]
              pub const fn encoding(&self) -> RegisterEncoding {
                  self.encoding
              }

              /// Returns byte ordering inside one 16-bit register.
              #[must_use]
              pub const fn byte_order(&self) -> ByteOrder {
                  self.byte_order
              }

              /// Returns word ordering for multi-register values.
              #[must_use]
              pub const fn word_order(&self) -> WordOrder {
                  self.word_order
              }

          EOF
          awk 'BEGIN { while ((getline l < "/tmp/codec-getters") > 0) h=h l ORS } /    \/\/\/ Decodes registers into one authoritative engineering value\./ && !d { printf "%s", h; d=1 } { print }' crates/lantern-domain/src/codec.rs > /tmp/codec.rs
          mv /tmp/codec.rs crates/lantern-domain/src/codec.rs

          sed -i '/    pub forbidden_raw: Vec<Vec<u16>>,/a\    #[serde(default, skip_serializing_if = "BTreeMap::is_empty")]\n    pub enum_values: BTreeMap<String, String>,\n    #[serde(default, skip_serializing_if = "BTreeMap::is_empty")]\n    pub bit_flags: BTreeMap<String, String>,' crates/lantern-profile/src/document.rs

          sed -i '/    description: String,/a\    source_address_notation: String,\n    source_address_value: u32,' crates/lantern-profile/src/validate/mod.rs
          sed -i '/    codec: RegisterCodec,/a\    enum_values: BTreeMap<i64, String>,\n    bit_flags: BTreeMap<u8, String>,' crates/lantern-profile/src/validate/mod.rs

          cat >/tmp/get1 <<'EOF'
              #[must_use]
              pub fn source_address_notation(&self) -> &str {
                  &self.source_address_notation
              }

              #[must_use]
              pub const fn source_address_value(&self) -> u32 {
                  self.source_address_value
              }

          EOF
          awk 'BEGIN { while ((getline l < "/tmp/get1") > 0) h=h l ORS } /    pub const fn block\(&self\) -> RegisterBlock/ && !d { printf "%s", h; d=1 } { print }' crates/lantern-profile/src/validate/mod.rs > /tmp/v1
          mv /tmp/v1 crates/lantern-profile/src/validate/mod.rs

          cat >/tmp/get2 <<'EOF'
              #[must_use]
              pub fn enum_values(&self) -> &BTreeMap<i64, String> {
                  &self.enum_values
              }

              #[must_use]
              pub fn bit_flags(&self) -> &BTreeMap<u8, String> {
                  &self.bit_flags
              }

          EOF
          awk 'BEGIN { while ((getline l < "/tmp/get2") > 0) h=h l ORS } /    pub fn quantity\(&self\) -> &QuantityKind/ && !d { printf "%s", h; d=1 } { print }' crates/lantern-profile/src/validate/mod.rs > /tmp/v2
          mv /tmp/v2 crates/lantern-profile/src/validate/mod.rs

          sed -i '/    let table = table(document.table);/a\    let source_address_notation = match document.address.notation {\n        AddressNotation::PduZeroBased => "pdu_zero_based",\n        AddressNotation::ProtocolOneBased => "protocol_one_based",\n        AddressNotation::Modicon5Digit => "modicon_5_digit",\n        AddressNotation::Modicon6Digit => "modicon_6_digit",\n    }\n    .to_owned();\n    let source_address_value = document.address.value;' crates/lantern-profile/src/validate/build/parameter.rs
          sed -i '/    document.forbidden_raw.dedup();/a\    let (enum_values, bit_flags) = validate_editor_metadata(document, encoding, &base)?;' crates/lantern-profile/src/validate/build/parameter.rs
          sed -i '/        description: document.description.clone(),/a\        source_address_notation,\n        source_address_value,' crates/lantern-profile/src/validate/build/parameter.rs
          sed -i '/        codec,/a\        enum_values,\n        bit_flags,' crates/lantern-profile/src/validate/build/parameter.rs

          cat >/tmp/editor-helper <<'EOF'
          fn validate_editor_metadata(
              document: &ParameterDocumentV1,
              encoding: RegisterEncoding,
              base: &str,
          ) -> Result<(BTreeMap<i64, String>, BTreeMap<u8, String>), ProfileError> {
              let enum_maximum = match encoding {
                  RegisterEncoding::Enum16 => Some(i64::from(u16::MAX)),
                  RegisterEncoding::Enum32 => Some(i64::from(u32::MAX)),
                  _ => None,
              };
              if enum_maximum.is_none() && !document.enum_values.is_empty() {
                  return Err(ProfileError::validation(
                      format!("{base}.enum_values"),
                      "enum_values are valid only for enum16/enum32 parameters",
                  ));
              }
              let mut enum_values = BTreeMap::new();
              if let Some(maximum) = enum_maximum {
                  for (raw_text, label) in &document.enum_values {
                      validate_text(format!("{base}.enum_values.{raw_text}"), label, false)?;
                      let raw = raw_text.parse::<i64>().map_err(|error| {
                          ProfileError::validation(format!("{base}.enum_values.{raw_text}"), error)
                      })?;
                      if raw < 0 || raw > maximum {
                          return Err(ProfileError::validation(
                              format!("{base}.enum_values.{raw_text}"),
                              format!("enum raw value must be in 0..={maximum}"),
                          ));
                      }
                      enum_values.insert(raw, label.clone());
                  }
              }

              let bit_width = match encoding {
                  RegisterEncoding::Bitfield16 => Some(16_u8),
                  RegisterEncoding::Bitfield32 => Some(32_u8),
                  RegisterEncoding::Bitfield64 => Some(64_u8),
                  _ => None,
              };
              if bit_width.is_none() && !document.bit_flags.is_empty() {
                  return Err(ProfileError::validation(
                      format!("{base}.bit_flags"),
                      "bit_flags are valid only for bitfield encodings",
                  ));
              }
              let mut bit_flags = BTreeMap::new();
              if let Some(width) = bit_width {
                  for (bit_text, label) in &document.bit_flags {
                      validate_text(format!("{base}.bit_flags.{bit_text}"), label, false)?;
                      let bit = bit_text.parse::<u8>().map_err(|error| {
                          ProfileError::validation(format!("{base}.bit_flags.{bit_text}"), error)
                      })?;
                      if bit >= width {
                          return Err(ProfileError::validation(
                              format!("{base}.bit_flags.{bit_text}"),
                              format!("bit index must be below {width}"),
                          ));
                      }
                      bit_flags.insert(bit, label.clone());
                  }
              }
              Ok((enum_values, bit_flags))
          }

          EOF
          awk 'BEGIN { while ((getline l < "/tmp/editor-helper") > 0) h=h l ORS } /^fn validate_read_back\(/ && !d { printf "%s", h; d=1 } { print }' crates/lantern-profile/src/validate/build/parameter.rs > /tmp/p
          mv /tmp/p crates/lantern-profile/src/validate/build/parameter.rs

          perl -0pi -e 's/address_notation_label\(parameter\.source_address_notation\(\)\)\.to_owned\(\)/parameter.source_address_notation().to_owned()/g' crates/lantern-app/src/parameters.rs
          perl -0pi -e 's/use lantern_profile::\{\n    AddressNotation, ReadBackPolicy, ValidatedDeviceProfile, ValidatedParameter,\n\};/use lantern_profile::{ReadBackPolicy, ValidatedDeviceProfile, ValidatedParameter};/s' crates/lantern-app/src/parameters.rs
          perl -0pi -e 's/\nfn address_notation_label\(notation: AddressNotation\) -> .*?\n\}\n\nfn read_back_label/\nfn read_back_label/s' crates/lantern-app/src/parameters.rs

          cargo fmt --all
          cargo check --workspace --all-features --locked

          git rm .github/workflows/issue15-core-edit2.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#15): validate typed editor metadata'
          git push origin HEAD:agent/issue-15
