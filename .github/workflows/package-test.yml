name: Package test

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      artifact_run_id:
        description: Source workflow run ID; empty means current run
        required: false
        default: ''
        type: string
      commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Existing Actions artifact containing arch/ and common/
        required: true
        type: string
      artifact_run_id:
        description: Workflow run ID that owns the artifact
        required: true
        type: string
      commit:
        description: Exact source commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package-test:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Verify active Debian 13 amd64 platform
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = vfd-lantern-podman-01
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = debian
          test "${VERSION_ID%%.*}" = 13

      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.commit }}" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          test -n "${{ inputs.artifact_name }}"
          if [[ -n "${{ inputs.artifact_run_id }}" ]]; then
            [[ "${{ inputs.artifact_run_id }}" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Prepare release system tools
        run: sh scripts/release/ensure-runner-tools.sh package

      - name: Download package artifact from current run
        if: ${{ inputs.artifact_run_id == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: target/package-stage

      - name: Download package artifact from explicit source run
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: target/package-stage
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Resolve pinned Trixie image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image=$(awk -F ' = ' '
            /^\[images\]$/ { in_images=1; next }
            /^\[/ { if (in_images) exit }
            in_images && $1 == "debian-trixie-slim" {
              gsub(/"/, "", $2); print $2; found=1; exit
            }
            END { if (!found) exit 1 }
          ' tools.lock.toml)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Install, smoke, integrity-check and uninstall exact .deb
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          deb=$(find target/package-stage/arch -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          test -f target/package-stage/common/profiles-v1.json
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            -e VFD_PACKAGE_DEB="$deb" \
            -e VFD_EXPECTED_PACKAGED_MANIFEST=target/package-stage/common/profiles-v1.json \
            "${{ steps.image.outputs.image }}" \
            sh scripts/release/test-deb.sh
