name: Stage issue 18 TUI integration

on:
  push:
    branches: [agent/issue-18]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-18
          fetch-depth: 0
      - name: Integrate fault TUI and acceptance gates
        shell: bash
        run: |
          set -euo pipefail

          lib=crates/lantern-tui/src/lib.rs
          ui=crates/lantern-tui/src/ui_state.rs
          key=crates/lantern-tui/src/keymap.rs
          screens=crates/lantern-tui/src/screens.rs

          perl -0pi -e 's/mod forms;\n/mod fault_keymap;\nmod fault_render;\nmod fault_state;\nmod forms;\n/' "$lib"
          perl -0pi -e 's/pub use forms::\*;\n/pub use fault_state::*;\npub use forms::*;\n/' "$lib"

          perl -0pi -e 's/use crate::\{FormState, ParameterEditorUiState, ParameterUiState, ScopeUiState, ScopeYRange\};/use crate::{FaultUiState, FormState, ParameterEditorUiState, ParameterUiState, ScopeUiState, ScopeYRange};/' "$ui"
          perl -0pi -e 's/    pub parameters: ParameterUiState,\n    pub modal:/    pub parameters: ParameterUiState,\n    pub faults: FaultUiState,\n    pub modal:/' "$ui"
          perl -0pi -e 's/            parameters: ParameterUiState::default\(\),\n            modal:/            parameters: ParameterUiState::default(),\n            faults: FaultUiState::default(),\n            modal:/' "$ui"
          perl -0pi -e 's/    SetSelectedIndex\(usize\),\n/    SetSelectedIndex(usize),\n    ToggleFaultUnacknowledged,\n    ToggleFaultUnknown,\n    OpenParameterIndex(usize),\n/' "$ui"
          perl -0pi -e 's/            UiAction::SetSelectedIndex\(index\) => \{\n                self.selected_index = index;\n            \}/            UiAction::SetSelectedIndex(index) => {\n                self.selected_index = index;\n            }\n            UiAction::ToggleFaultUnacknowledged => {\n                self.faults.unacknowledged_only = !self.faults.unacknowledged_only;\n                self.selected_index = 0;\n            }\n            UiAction::ToggleFaultUnknown => {\n                self.faults.unknown_only = !self.faults.unknown_only;\n                self.selected_index = 0;\n            }\n            UiAction::OpenParameterIndex(index) => {\n                self.screen = Screen::Parameters;\n                self.selected_index = index;\n                self.scroll_offset = 0;\n                self.connection_edit = None;\n                self.parameters.editor = None;\n                self.form.clear();\n            }/' "$ui"

          perl -0pi -e 's/    parameter_keymap::\{map_parameter_editor_key, map_parameter_key\},/    fault_keymap::map_fault_key,\n    parameter_keymap::{map_parameter_editor_key, map_parameter_key},/' "$key"
          perl -0pi -e 's/    if ui\.screen == Screen::Parameters\n        && let Some\(action\) = map_parameter_key/    if ui.screen == Screen::Faults\n        \&\& let Some(action) = map_fault_key(ui, view, key)\n    {\n        return Some(action);\n    }\n\n    if ui.screen == Screen::Parameters\n        \&\& let Some(action) = map_parameter_key/' "$key"
          perl -0pi -e 's/pub const HELP_BINDINGS: \[KeyBinding; 36\]/pub const HELP_BINDINGS: [KeyBinding; 42]/' "$key"
          perl -0pi -e 's/    KeyBinding \{\n        key: "Tab",/    KeyBinding {\n        key: "Faults j\/k",\n        description: "select bounded fault timeline event",\n    },\n    KeyBinding {\n        key: "Faults a",\n        description: "acknowledge selected event locally",\n    },\n    KeyBinding {\n        key: "Faults e",\n        description: "export selected Verified fault report",\n    },\n    KeyBinding {\n        key: "Faults p",\n        description: "open source parameter in Parameters",\n    },\n    KeyBinding {\n        key: "Faults o\/u",\n        description: "filter unacknowledged \/ unknown events",\n    },\n    KeyBinding {\n        key: "Faults reset",\n        description: "not available; diagnostics are read-only",\n    },\n    KeyBinding {\n        key: "Tab",/' "$key"

          perl -0pi -e 's/    parameter_render::parameter_lines,/    fault_render::fault_lines,\n    parameter_render::parameter_lines,/' "$screens"
          perl -0pi -e 's/        Screen::Faults => planned_lines\(\n            "Faults",\n            "#18",\n            "Fault tracking and freeze-frame policy remain owned by #18\."\n        \),/        Screen::Faults => fault_lines(view, ui),/' "$screens"

          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test -p lantern-domain -p lantern-profile -p lantern-app -p lantern-storage -p lantern-tui -p vfd-lantern --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

          git rm .github/workflows/issue18-tui-integration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#18): complete fault TUI and acceptance coverage'
          git push origin HEAD:agent/issue-18
