name: M6.5.4 session SPoT helper

on:
  push:
    branches:
      - agent/m6.5-spot-session-write

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/m6.5-spot-session-write
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic SPoT refactor
        shell: bash
        run: |
          set -euo pipefail
          sh .github/m65-spot-apply.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: keep session state authority in application (M6.5.4)'
          git push origin HEAD:agent/m6.5-spot-session-write
