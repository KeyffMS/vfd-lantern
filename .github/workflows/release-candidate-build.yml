name: Release candidate build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full candidate commit SHA
        required: true
        type: string
      version:
        description: Final candidate version (no RC rewrite)
        required: true
        type: string
      qualification_index:
        description: Repository path to frozen qualification index
        required: true
        default: release/fixtures/qualification-index-v1.json
        type: string
      dry_run:
        description: Build and validate without creating a GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-build-${{ inputs.commit }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_IMAGE_DIGEST: sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132

jobs:
  build:
    name: Native Trixie package / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: '["self-hosted","linux","x64","podman","vfd-lantern"]'
          - arch: arm64
            runner: '["self-hosted","linux","arm64","vfd-lantern-release-arm64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.commit }}" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          test -n "${{ inputs.version }}"
          case "${{ inputs.version }}" in *-rc*|*RC*) echo 'candidate version must already be final' >&2; exit 1;; esac

      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen qualification input
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ inputs.qualification_index }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          test -n "$(git log -1 --format=%H -- "${{ inputs.qualification_index }}")"

      - name: Install pinned Rust and release tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          export CARGO_INSTALL_ROOT="$HOME/.cache/vfd-lantern-cargo-tools"
          export CARGO_TARGET_DIR="$HOME/.cache/vfd-lantern-cargo-install-target"
          sh scripts/install-cargo-tools.sh release

      - name: Build deterministic product stage
        shell: bash
        env:
          VFD_RELEASE_COMMIT: ${{ inputs.commit }}
          VFD_RELEASE_VERSION: ${{ inputs.version }}
          VFD_RELEASE_QUALIFICATION_INDEX: ${{ inputs.qualification_index }}
          VFD_RELEASE_IMAGE_DIGEST: ${{ env.RELEASE_IMAGE_DIGEST }}
          VFD_RELEASE_ARCH: ${{ matrix.arch }}
          VFD_RELEASE_TEST_MODE: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          sh scripts/release/build-product.sh
          test -d "target/release-stage/${{ matrix.arch }}/arch"
          test -d "target/release-stage/${{ matrix.arch }}/common"

      - name: Verify two clean builds are reproducible
        shell: bash
        env:
          VFD_RELEASE_COMMIT: ${{ inputs.commit }}
          VFD_RELEASE_VERSION: ${{ inputs.version }}
          VFD_RELEASE_QUALIFICATION_INDEX: ${{ inputs.qualification_index }}
          VFD_RELEASE_IMAGE_DIGEST: ${{ env.RELEASE_IMAGE_DIGEST }}
          VFD_RELEASE_ARCH: ${{ matrix.arch }}
          VFD_RELEASE_TEST_MODE: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          rm -rf .issue24-repro-a .issue24-repro-b
          cp -a "target/release-stage/${{ matrix.arch }}" .issue24-repro-a
          cargo clean
          sh scripts/release/build-product.sh
          cp -a "target/release-stage/${{ matrix.arch }}" .issue24-repro-b
          (cd .issue24-repro-a && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > /tmp/repro-a.sha256
          (cd .issue24-repro-b && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > /tmp/repro-b.sha256
          diff -u /tmp/repro-a.sha256 /tmp/repro-b.sha256
          rm -rf .issue24-repro-a .issue24-repro-b

      - name: Upload architecture stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.arch }}
          path: target/release-stage/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble immutable product snapshot
    needs: build
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Download amd64 stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-amd64
          path: target/native/amd64

      - name: Download arm64 stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-arm64
          path: target/native/arm64

      - name: Assemble and finalize candidate product assets
        shell: bash
        env:
          VFD_AMD64_STAGE: target/native/amd64
          VFD_ARM64_STAGE: target/native/arm64
          VFD_CANDIDATE_PRODUCT_DIR: target/candidate-assets
          VFD_RELEASE_COMMIT: ${{ inputs.commit }}
          VFD_RELEASE_VERSION: ${{ inputs.version }}
          VFD_RELEASE_IMAGE_DIGEST: ${{ env.RELEASE_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          sh scripts/release/assemble-matrix.sh
          sh scripts/release/finalize-product-assets.sh
          (cd target/candidate-assets && sha256sum -c SHA256SUMS)
          test ! -e target/candidate-assets/candidate-manifest-v1.json

      - name: Attest assembled product snapshot
        id: attest-product
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/candidate-assets/*
          show-summary: true

      - name: Upload candidate product snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-product-assets
          path: target/candidate-assets
          if-no-files-found: error
          retention-days: 14

      - name: Create and re-download draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          tag="v${{ inputs.version }}"
          ! gh release view "$tag" >/dev/null 2>&1
          printf 'Candidate built from %s. Final publication requires #25 gates.\n' "${{ inputs.commit }}" > target/release-notes.txt
          gh release create "$tag" --draft --target "${{ inputs.commit }}" --title "VFD Lantern ${{ inputs.version }}" --notes-file target/release-notes.txt
          gh release upload "$tag" target/candidate-assets/*
          rm -rf target/redownloaded
          mkdir -p target/redownloaded
          gh release download "$tag" --dir target/redownloaded
          (cd target/redownloaded && sha256sum -c SHA256SUMS)
          gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id' > target/draft-release-id.txt

      - name: Dry-run draft policy
        if: ${{ inputs.dry_run }}
        run: echo 'dry-run validated build/assembly/reproducibility and product attestation; no GitHub Release created'

      - name: Persist candidate build reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/candidate-reference
          {
            echo "commit=${{ inputs.commit }}"
            echo "version=${{ inputs.version }}"
            echo "product_attestation_id=${{ steps.attest-product.outputs.attestation-id }}"
            if [ -f target/draft-release-id.txt ]; then
              echo "draft_release_id=$(cat target/draft-release-id.txt)"
              echo "tag=v${{ inputs.version }}"
            else
              echo 'draft_release_id=DRY_RUN'
            fi
          } > target/candidate-reference/reference.txt

      - name: Upload candidate build reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-build-reference
          path: target/candidate-reference/reference.txt
          if-no-files-found: error
          retention-days: 14
