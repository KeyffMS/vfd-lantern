name: Stage issue 23 cargo-vet coverage

on:
  push:
    branches:
      - agent/issue-23
    paths:
      - '.github/scripts/issue23_cargo_vet_fix.rs'
      - '.github/workflows/issue23-cargo-vet-fix.yml'

permissions:
  contents: write

jobs:
  cargo-vet:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-23
          fetch-depth: 0
      - name: Apply exact-version policy coverage
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue23_cargo_vet_fix.rs -o /tmp/issue23-cargo-vet-fix
          /tmp/issue23-cargo-vet-fix
          export CARGO_INSTALL_ROOT="$HOME/.cache/vfd-lantern-cargo-tools"
          export CARGO_TARGET_DIR="$HOME/.cache/vfd-lantern-cargo-install-target"
          sh scripts/install-cargo-tools.sh supply-chain
          export CARGO_VET_REPORT=target/supply-chain/cargo-vet-summary-issue23-fix.json
          sh scripts/check-supply-chain.sh
          git rm .github/workflows/issue23-cargo-vet-fix.yml
          git rm .github/scripts/issue23_cargo_vet_fix.rs
          git add supply-chain/config.toml supply-chain/README.md .github/workflows/issue23-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(#23): cover production observability dependencies in cargo vet'
          git push origin HEAD:agent/issue-23
