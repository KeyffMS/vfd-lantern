name: Issue 24 package acceptance

on:
  push:
    branches:
      - agent/issue-24
    paths:
      - '.github/workflows/issue24-package-acceptance.yml'

permissions:
  contents: read

jobs:
  amd64-package:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "vfd-lantern-podman-01"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          command -v git
          command -v cc
          command -v make
          command -v pkg-config
          command -v jq
          command -v objcopy
          command -v podman
          command -v sha256sum
          pkg-config --exists openssl
          pkg-config --exists libudev

      - name: Check out exact issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-24
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust and release tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          export CARGO_INSTALL_ROOT="$HOME/.cache/vfd-lantern-cargo-tools"
          export CARGO_TARGET_DIR="$HOME/.cache/vfd-lantern-cargo-install-target"
          sh scripts/install-cargo-tools.sh release

      - name: Validate source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --locked -p lantern-release
          mdbook build

      - name: Resolve deterministic test inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "vfd-lantern") | .version')
          image=$(awk -F ' = ' '
            /^\[images\]$/ { in_images=1; next }
            /^\[/ { if (in_images) exit }
            in_images && $1 == "debian-trixie-slim" { gsub(/"/, "", $2); print $2; found=1; exit }
            END { if (!found) exit 1 }
          ' tools.lock.toml)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Clean build A
        shell: bash
        env:
          VFD_RELEASE_COMMIT: ${{ steps.inputs.outputs.commit }}
          VFD_RELEASE_VERSION: ${{ steps.inputs.outputs.version }}
          VFD_RELEASE_QUALIFICATION_INDEX: release/fixtures/qualification-index-v1.json
          VFD_RELEASE_IMAGE_DIGEST: sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
          VFD_RELEASE_ARCH: amd64
          VFD_RELEASE_TEST_MODE: '1'
        run: |
          set -euo pipefail
          cargo clean
          sh scripts/release/build-product.sh
          stage=target/release-stage/amd64
          test -d "$stage/arch"
          test -d "$stage/common"
          (
            cd "$stage"
            find arch common -type f -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done
          ) > "$RUNNER_TEMP/issue24-repro-a.sha256"
          rm -rf "$RUNNER_TEMP/issue24-package-a"
          cp -a "$stage" "$RUNNER_TEMP/issue24-package-a"

      - name: Install smoke and uninstall exact deb
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/issue24-package-a"
          deb=$(find "$stage/arch" -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          test -f "$stage/common/profiles-v1.json"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/issue24-package-a:/package:ro" \
            -w /work \
            -e VFD_PACKAGE_DEB=/package/arch/$(basename "$deb") \
            -e VFD_EXPECTED_PACKAGED_MANIFEST=/package/common/profiles-v1.json \
            "${{ steps.inputs.outputs.image }}" \
            sh scripts/release/test-deb.sh

      - name: Clean build B and verify reproducibility
        shell: bash
        env:
          VFD_RELEASE_COMMIT: ${{ steps.inputs.outputs.commit }}
          VFD_RELEASE_VERSION: ${{ steps.inputs.outputs.version }}
          VFD_RELEASE_QUALIFICATION_INDEX: release/fixtures/qualification-index-v1.json
          VFD_RELEASE_IMAGE_DIGEST: sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
          VFD_RELEASE_ARCH: amd64
          VFD_RELEASE_TEST_MODE: '1'
        run: |
          set -euo pipefail
          cargo clean
          sh scripts/release/build-product.sh
          stage=target/release-stage/amd64
          (
            cd "$stage"
            find arch common -type f -print | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done
          ) > "$RUNNER_TEMP/issue24-repro-b.sha256"
          diff -u "$RUNNER_TEMP/issue24-repro-a.sha256" "$RUNNER_TEMP/issue24-repro-b.sha256"

      - name: Verify package/release safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'publish = false' crates/vfd-lantern/Cargo.toml
          grep -Fq 'separate-debug-symbols = true' crates/vfd-lantern/Cargo.toml
          grep -Fq 'SOURCE_DATE_EPOCH' scripts/release/build-product.sh
          test ! -e target/release-stage/amd64/common/candidate-manifest-v1.json
          grep -Fq 'dry_run' .github/workflows/release-candidate-build.yml
          grep -Fq 'dry_run' .github/workflows/release-candidate-finalize.yml
          grep -Fq 'dry_run' .github/workflows/release-publish.yml
