name: M6.5.4 lightweight verification

on:
  push:
    branches:
      - agent/m6.5-spot-session-write

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/m6.5-spot-session-write
          fetch-depth: 0
          persist-credentials: true
      - name: Compile, lint architecture, and test write runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p vfd-lantern
          cargo test --locked -p vfd-lantern write_runtime
          sh scripts/check-architecture.sh
      - name: Remove verification workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m65-spot-verify.yml
          git commit -m 'chore: remove M6.5.4 lightweight verification helper'
          git push origin HEAD:agent/m6.5-spot-session-write
