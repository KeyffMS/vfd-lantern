name: Publish verified issue 10 candidate

on:
  push:
    branches:
      - agent/issue-10-publisher
    paths:
      - .github/workflows/publish-issue-10-verified.yml
      - .issue10-publisher/**

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-verified-issue-10
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    env:
      DELIVERY_BRANCH: agent/issue-10
      EVIDENCE: /tmp/issue-10-publisher
      CARGO_VET_REPORT: /tmp/issue-10-publisher/cargo-vet-summary.json
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git gzip jq libssl-dev libudev-dev \
            pkg-config rustup

      - name: Check out publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-10-publisher
          fetch-depth: 0

      - name: Record publisher start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'stage=start\n' > "$EVIDENCE/state.txt"
          body="<!-- issue-10-verified-publisher:start:${GITHUB_RUN_ID} -->
          ## Zweryfikowany publisher #10 uruchomiony

          Przebieg: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Źródło jest związane manifestem, SHA-256 patcha, SHA gzip i Git blob SHA obu części."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Reconstruct and constrain exact candidate
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=reconstruct\n' > "$EVIDENCE/state.txt"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          manifest=.issue10-publisher/manifest.json
          test -s "$manifest"
          cp "$manifest" "$EVIDENCE/manifest.json"
          test "$(jq -r .schema "$manifest")" = 'vfd-lantern-issue-payload-v1'
          test "$(jq -r .issue "$manifest")" = '10'
          test "$(jq -r .payload_encoding "$manifest")" = 'concatenated-base64-of-gzip'
          test "$(jq '.parts | length' "$manifest")" = '2'
          test "$(find .issue10-publisher -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = '2'

          : > /tmp/issue10.payload.b64
          for index in 0 1; do
            path=$(jq -r ".parts[$index].path" "$manifest")
            expected_bytes=$(jq -r ".parts[$index].bytes" "$manifest")
            expected_sha=$(jq -r ".parts[$index].sha256" "$manifest")
            expected_blob=$(jq -r ".parts[$index].git_blob_sha" "$manifest")
            case "$path" in
              .issue10-publisher/part-*) ;;
              *) printf 'invalid payload path: %s\n' "$path" >&2; exit 1 ;;
            esac
            test -f "$path"
            test "$(wc -c < "$path" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha"
            test "$(git hash-object "$path")" = "$expected_blob"
            cat "$path" >> /tmp/issue10.payload.b64
          done

          base64 --decode /tmp/issue10.payload.b64 > /tmp/issue10.patch.gz
          test "$(wc -c < /tmp/issue10.patch.gz | tr -d ' ')" = "$(jq -r .compressed_bytes "$manifest")"
          test "$(sha256sum /tmp/issue10.patch.gz | awk '{print $1}')" = "$(jq -r .compressed_sha256 "$manifest")"
          gzip -dc /tmp/issue10.patch.gz > /tmp/issue10.patch
          test "$(wc -c < /tmp/issue10.patch | tr -d ' ')" = "$(jq -r .patch_bytes "$manifest")"
          test "$(sha256sum /tmp/issue10.patch | awk '{print $1}')" = "$(jq -r .patch_sha256 "$manifest")"
          grep -q '^diff --git ' /tmp/issue10.patch
          grep -q 'pub struct PollPlanner' /tmp/issue10.patch
          grep -q 'pub struct PollExecutor' /tmp/issue10.patch
          cp /tmp/issue10.patch "$EVIDENCE/issue-10.patch"
          sha256sum /tmp/issue10.patch /tmp/issue10.patch.gz > "$EVIDENCE/payload-sha256.txt"

          base_sha=$(jq -r .base_sha "$manifest")
          base_tree=$(jq -r .base_tree_sha "$manifest")
          expected_tree=$(jq -r .expected_tree_sha "$manifest")
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$base_sha"
          test "$(git rev-parse origin/main^{tree})" = "$base_tree"
          git reset --hard origin/main
          git clean -fdx

          git apply --check --whitespace=error-all /tmp/issue10.patch
          git apply --index --whitespace=error-all /tmp/issue10.patch
          git diff --cached --check
          test "$(git write-tree)" = "$expected_tree"

          git diff --cached --name-only | sort > "$EVIDENCE/changed-files.txt"
          jq -r '.changed_paths[]' "$EVIDENCE/manifest.json" | sort > "$EVIDENCE/expected-files.txt"
          diff -u "$EVIDENCE/expected-files.txt" "$EVIDENCE/changed-files.txt"
          test "$(wc -l < "$EVIDENCE/changed-files.txt" | tr -d ' ')" = "$(jq -r .expected_changed_file_count "$EVIDENCE/manifest.json")"
          while IFS= read -r path; do
            case "$path" in
              Cargo.lock|crates/lantern-app/*|crates/lantern-sim/*|crates/lantern-transport/*) ;;
              *) printf 'forbidden issue #10 path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < "$EVIDENCE/changed-files.txt"

          test -f crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollPlanner' crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollExecutor' crates/lantern-app/src/poll.rs
          grep -q 'MonotonicClock' crates/lantern-app/src/poll.rs
          test ! -e .issue10-publisher
          git diff --cached --stat > "$EVIDENCE/diff-stat.txt"
          printf 'base_sha=%s\nbase_tree=%s\nexpected_tree=%s\n' \
            "$base_sha" "$base_tree" "$expected_tree" > "$EVIDENCE/identity.txt"

      - name: Install pinned Rust and supply-chain tools
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/vfd-lantern-cargo-tools
        run: |
          printf 'stage=toolchain\n' > "$EVIDENCE/state.txt"
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version | tee "$EVIDENCE/rust-version.txt"
          cargo --version | tee "$EVIDENCE/cargo-version.txt"
          sh scripts/install-cargo-tools.sh supply-chain

      - name: Run complete candidate gate
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=gate\n' > "$EVIDENCE/state.txt"
          exec > >(tee "$EVIDENCE/gate.log") 2>&1
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo build --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked -- --test-threads=1
          cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          sh scripts/check-supply-chain.sh
          git diff --cached --check
          git diff --check
          cargo run --release -p lantern-app --example poll_planner_benchmark | tee "$EVIDENCE/benchmark.txt"
          grep -q 'parameters=20000' "$EVIDENCE/benchmark.txt"
          grep -q 'blocks=160' "$EVIDENCE/benchmark.txt"
          grep -q 'utilization_ppm=1120' "$EVIDENCE/benchmark.txt"
          grep -q 'rejections=0' "$EVIDENCE/benchmark.txt"
          test "$(git rev-parse origin/main)" = "$(jq -r .base_sha "$EVIDENCE/manifest.json")"
          test "$(git write-tree)" = "$(jq -r .expected_tree_sha "$EVIDENCE/manifest.json")"

      - name: Publish one logical commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          printf 'stage=publish\n' > "$EVIDENCE/state.txt"
          git config user.name 'VFD Lantern contributors'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "$(jq -r .commit_message "$EVIDENCE/manifest.json")"
          candidate_sha=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^)" = "$(jq -r .base_sha "$EVIDENCE/manifest.json")"
          test "$(git rev-list --count origin/main..HEAD)" = '1'
          test "$candidate_tree" = "$(jq -r .expected_tree_sha "$EVIDENCE/manifest.json")"
          git push --force origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          printf 'candidate_sha=%s\ncandidate_tree=%s\ncommits_over_main=1\n' \
            "$candidate_sha" "$candidate_tree" >> "$EVIDENCE/identity.txt"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_OUTPUT"

      - name: Record publisher success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.publish.outputs.candidate_tree }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-10-verified-publisher:success:${GITHUB_RUN_ID} -->
          ## Zweryfikowany publisher #10 — PASS

          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - candidate: \`$CANDIDATE_SHA\`
          - tree: \`$CANDIDATE_TREE\`
          - base: \`$(jq -r .base_sha "$EVIDENCE/manifest.json")\`
          - patch SHA-256: \`$(jq -r .patch_sha256 "$EVIDENCE/manifest.json")\`
          - pełny gate wraz z supply-chain: **PASS**
          - commitów względem main: **1**

          Gałąź \`agent/issue-10\` jest gotowym kandydatem do standardowego CI amd64/arm64."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Record publisher failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stage=$(sed -n 's/^stage=//p' "$EVIDENCE/state.txt" 2>/dev/null || printf unknown)
          body="<!-- issue-10-verified-publisher:failure:${GITHUB_RUN_ID} -->
          ## Zweryfikowany publisher #10 — FAIL-CLOSED

          Przebieg: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Zatrzymana bramka: \`$stage\`.
          Gałąź dostawcza nie jest uznana za kandydata; #10 pozostaje otwarte."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null
