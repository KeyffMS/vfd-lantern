name: M6.5 boxing fix helper

on:
  push:
    branches:
      - agent/m6.5-backup-restore-ui

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/m6.5-backup-restore-ui
          fetch-depth: 0
      - name: Install pinned toolchain
        run: |
          set -eu
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Apply minimal enum indirection, verify, self-clean, and commit
        run: |
          set -eu
          git apply <<'PATCH'
          diff --git a/crates/lantern-app/src/backup_restore_flow.rs b/crates/lantern-app/src/backup_restore_flow.rs
          --- a/crates/lantern-app/src/backup_restore_flow.rs
          +++ b/crates/lantern-app/src/backup_restore_flow.rs
          @@ -286,7 +286,7 @@ pub enum BackupRestoreAction {
               LoadSource(PathBuf),
               SourceLoaded(Result<BackupSnapshot, String>),
               PrepareRestore,
          -    RestorePrepared(Result<PreparedRestoreResult, String>),
          +    RestorePrepared(Box<Result<PreparedRestoreResult, String>>),
               ConfirmRestore { operator_text: String },
               ClearPrepared,
               RestoreFinished(Result<RestoreExecutionSummary, String>),
          @@ -305,7 +305,7 @@ pub enum BackupRestoreEffect {
                   request: Box<BackupCaptureRequest>,
               },
               ExecuteRestore {
          -        plan: ApprovedRestorePlan,
          +        plan: Box<ApprovedRestorePlan>,
                   confirmation: RestoreConfirmation,
                   snapshot: WriteSessionSnapshot,
               },
          diff --git a/crates/lantern-app/src/application.rs b/crates/lantern-app/src/application.rs
          --- a/crates/lantern-app/src/application.rs
          +++ b/crates/lantern-app/src/application.rs
          @@ -365,7 +365,7 @@ impl ApplicationState {
                   )]
               }
               BackupRestoreAction::RestorePrepared(result) => {
          -        self.backup_restore.restore_prepared(result);
          +        self.backup_restore.restore_prepared(*result);
                   Vec::new()
               }
               BackupRestoreAction::ConfirmRestore { operator_text } => {
          @@ -397,7 +397,7 @@ impl ApplicationState {
                   self.backup_restore.begin_execute();
                   vec![ApplicationEffect::BackupRestore(
                       BackupRestoreEffect::ExecuteRestore {
          -                plan,
          +                plan: Box::new(plan),
                           confirmation,
                           snapshot,
                       },
          diff --git a/crates/vfd-lantern/src/write_runtime.rs b/crates/vfd-lantern/src/write_runtime.rs
          --- a/crates/vfd-lantern/src/write_runtime.rs
          +++ b/crates/vfd-lantern/src/write_runtime.rs
          @@ -269,7 +269,7 @@ impl ProductionWriteRuntime {
                       }
                       .await;
                       let _ = sender.send(ApplicationAction::BackupRestore(
          -                BackupRestoreAction::RestorePrepared(result),
          +                BackupRestoreAction::RestorePrepared(Box::new(result)),
                       ));
                   });
                   Ok(())
          @@ -291,7 +291,7 @@ impl ProductionWriteRuntime {
                           })?;
                           let step_count = plan.steps().len();
                           let mut permit = coordinator
          -                    .begin_restore(plan, confirmation)
          +                    .begin_restore(*plan, confirmation)
                               .await
                               .map_err(|error| error.to_string())?;
                           for index in 0..step_count {
          PATCH
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git rm .github/workflows/m65-clippy-box-helper.yml
          git add \
            crates/lantern-app/src/application.rs \
            crates/lantern-app/src/backup_restore_flow.rs \
            crates/vfd-lantern/src/write_runtime.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: box large backup restore payloads"
          git push origin HEAD:agent/m6.5-backup-restore-ui
