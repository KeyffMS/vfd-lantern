name: M6.5 boxing fix helper

on:
  push:
    branches:
      - agent/m6.5-backup-restore-ui

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/m6.5-backup-restore-ui
          fetch-depth: 0
      - name: Install pinned toolchain
        run: |
          set -eu
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Apply minimal enum indirection, verify, self-clean, and commit
        run: |
          set -eu
          flow=crates/lantern-app/src/backup_restore_flow.rs
          app=crates/lantern-app/src/application.rs
          runtime=crates/vfd-lantern/src/write_runtime.rs

          test "$(grep -Fxc '    RestorePrepared(Result<PreparedRestoreResult, String>),' "$flow")" -eq 1
          test "$(grep -Fxc '        plan: ApprovedRestorePlan,' "$flow")" -eq 1
          test "$(grep -Fxc '                self.backup_restore.restore_prepared(result);' "$app")" -eq 1
          test "$(grep -Fxc '                        plan,' "$app")" -ge 1
          test "$(grep -Fc 'BackupRestoreAction::RestorePrepared(result)' "$runtime")" -eq 1
          test "$(grep -Fc '.begin_restore(plan, confirmation)' "$runtime")" -eq 1

          sed -i 's/^    RestorePrepared(Result<PreparedRestoreResult, String>),$/    RestorePrepared(Box<Result<PreparedRestoreResult, String>>),/' "$flow"
          sed -i 's/^        plan: ApprovedRestorePlan,$/        plan: Box<ApprovedRestorePlan>,/' "$flow"
          sed -i 's/^                self\.backup_restore\.restore_prepared(result);$/                self.backup_restore.restore_prepared(*result);/' "$app"
          sed -i '/BackupRestoreEffect::ExecuteRestore {/,/                )]/ s/^                        plan,$/                        plan: Box::new(plan),/' "$app"
          sed -i 's/BackupRestoreAction::RestorePrepared(result)/BackupRestoreAction::RestorePrepared(Box::new(result))/' "$runtime"
          sed -i 's/\.begin_restore(plan, confirmation)/.begin_restore(*plan, confirmation)/' "$runtime"

          test "$(grep -Fxc '    RestorePrepared(Box<Result<PreparedRestoreResult, String>>),' "$flow")" -eq 1
          test "$(grep -Fxc '        plan: Box<ApprovedRestorePlan>,' "$flow")" -eq 1
          test "$(grep -Fxc '                self.backup_restore.restore_prepared(*result);' "$app")" -eq 1
          test "$(grep -Fc 'BackupRestoreAction::RestorePrepared(Box::new(result))' "$runtime")" -eq 1
          test "$(grep -Fc '.begin_restore(*plan, confirmation)' "$runtime")" -eq 1

          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git rm .github/workflows/m65-clippy-box-helper.yml
          git add "$flow" "$app" "$runtime"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: box large backup restore payloads"
          git push origin HEAD:agent/m6.5-backup-restore-ui
