name: M6.5 rustfmt helper

on:
  push:
    branches:
      - agent/m6.5-backup-restore-ui

permissions:
  contents: read

jobs:
  format:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned rustfmt
        run: |
          set -eu
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - name: Generate formatted source artifact
        run: |
          set -eu
          cargo fmt --all
          mkdir -p target/m65-rustfmt
          cp --parents \
            crates/lantern-app/src/application.rs \
            crates/lantern-app/src/backup_restore_flow.rs \
            crates/lantern-app/src/lib.rs \
            crates/lantern-tui/src/backup_render.rs \
            crates/lantern-tui/src/keymap.rs \
            crates/lantern-tui/src/lib.rs \
            crates/lantern-tui/src/ui_state.rs \
            crates/vfd-lantern/src/connection_runtime.rs \
            crates/vfd-lantern/src/main.rs \
            crates/vfd-lantern/src/write_runtime.rs \
            target/m65-rustfmt/
      - name: Upload formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m65-rustfmt-${{ github.sha }}
          path: target/m65-rustfmt
          retention-days: 1
