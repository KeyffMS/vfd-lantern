name: Publish verified issue 10 candidate

on:
  push:
    branches:
      - agent/issue-10-publisher

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-issue-10-candidate
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    env:
      BASE_SHA: 8473bc93e95dfe8ddcb815c2ff7d7f1c521a9bcf
      PATCH_URL: https://paste.rs/vfd-lantern-issue10-pollplanner-20260818.patch
      DELIVERY_BRANCH: agent/issue-10
      CARGO_VET_REPORT: target/supply-chain/issue-10-publisher.json
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            jq \
            libssl-dev \
            libudev-dev \
            pkg-config \
            rustup

      - name: Record publisher start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-10-publisher:start:${GITHUB_RUN_ID} -->
          ## Publisher #10 uruchomiony

          Przebieg: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Kandydat pozostaje fail-closed do końca pełnej bramki Debiana 13 / Rust 1.97.1."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Check out publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-10-publisher
          fetch-depth: 0

      - name: Reconstruct exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          evidence="$GITHUB_WORKSPACE/target/issue-10-publisher"
          mkdir -p "$evidence"

          curl --fail --location --retry 3 --silent --show-error \
            "$PATCH_URL" -o /tmp/issue10.patch
          test -s /tmp/issue10.patch
          grep -q '^diff --git ' /tmp/issue10.patch
          grep -q 'pub struct PollPlanner' /tmp/issue10.patch
          grep -q 'pub struct PollExecutor' /tmp/issue10.patch
          sha256sum /tmp/issue10.patch | tee "$evidence/patch.sha256"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --hard origin/main
          git clean -fdx
          mkdir -p "$evidence"

          git apply --check --whitespace=error-all /tmp/issue10.patch
          git apply --index --whitespace=error-all /tmp/issue10.patch
          git diff --cached --check

          test -f crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollPlanner' crates/lantern-app/src/poll.rs
          grep -q 'pub struct PollExecutor' crates/lantern-app/src/poll.rs

          git diff --cached --name-only | tee "$evidence/changed-files.txt"
          while IFS= read -r path; do
            case "$path" in
              Cargo.lock|crates/lantern-app/*|crates/lantern-sim/*)
                ;;
              *)
                printf 'issue #10 patch contains a forbidden path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < "$evidence/changed-files.txt"

          test ! -e .issue10-publisher
          test ! -e .github/workflows/publish-issue-10-candidate.yml
          printf 'base_sha=%s\n' "$BASE_SHA" | tee "$evidence/identity.txt"
          printf 'candidate_tree=%s\n' "$(git write-tree)" | tee -a "$evidence/identity.txt"
          git diff --cached --stat | tee "$evidence/diff-stat.txt"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Install pinned supply-chain tools
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/vfd-lantern-cargo-tools
        run: sh scripts/install-cargo-tools.sh supply-chain

      - name: Run complete candidate gate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/issue-10-publisher"
          exec > >(tee "$evidence/gate.log") 2>&1

          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo build --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked -- --test-threads=1
          cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          sh scripts/check-supply-chain.sh
          git diff --cached --check
          git diff --check

          cargo run --release -p lantern-app --example poll_planner_benchmark \
            | tee "$evidence/benchmark.txt"
          grep -q 'parameters=20000' "$evidence/benchmark.txt"
          grep -q 'blocks=160' "$evidence/benchmark.txt"
          grep -q 'rejections=0' "$evidence/benchmark.txt"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Publish one logical commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/issue-10-publisher"
          git config user.name 'VFD Lantern contributors'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Implement deterministic PollPlanner and bounded bus budget (#10)'

          candidate_sha=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count origin/main..HEAD)" = 1
          test "$candidate_tree" = "$(sed -n 's/^candidate_tree=//p' "$evidence/identity.txt")"
          git push --force origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          printf 'candidate_sha=%s\n' "$candidate_sha" | tee -a "$evidence/identity.txt"
          printf 'commits_over_main=1\n' | tee -a "$evidence/identity.txt"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Record publisher success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-10-publisher:success:${GITHUB_RUN_ID} -->
          ## Publisher #10 — PASS

          Pełna bramka wydawcy przeszła. Gałąź \`agent/issue-10\` wskazuje dokładnie \`$CANDIDATE_SHA\` i zawiera jeden commit względem \`$BASE_SHA\`. Następna bramka: standardowy CI PR na amd64 i arm64."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Record publisher failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- issue-10-publisher:failure:${GITHUB_RUN_ID} -->
          ## Publisher #10 — FAIL-CLOSED

          Przebieg ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} nie przeszedł pełnej bramki. Gałąź dostawcza nie jest uznana za kandydata; #10 pozostaje otwarte."
          payload=$(jq -n --arg body "$body" '{body:$body}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --request POST \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/10/comments" \
            --data "$payload" >/dev/null

      - name: Upload publisher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-10-publisher-evidence
          path: target/issue-10-publisher
          if-no-files-found: warn
          retention-days: 14
