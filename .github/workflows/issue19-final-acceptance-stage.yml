name: Stage issue 19 final CSV acceptance

on:
  push:
    branches:
      - agent/issue-19

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-19
          fetch-depth: 0
      - name: Close CSV acceptance gaps
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue19_acceptance_stage.rs -o /tmp/issue19-acceptance
          /tmp/issue19-acceptance
          rustc --edition=2024 .github/scripts/issue19_acceptance_persist_fix.rs -o /tmp/issue19-persist-fix
          /tmp/issue19-persist-fix
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-features --locked
          cargo build --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo run --locked --release -p lantern-storage --example csv_writer_benchmark
          cargo run --locked -p lantern-sim --example connection_process_acceptance
          sh scripts/check-architecture.sh
          export CARGO_INSTALL_ROOT="$HOME/.cache/vfd-lantern-cargo-tools"
          export CARGO_TARGET_DIR="$HOME/.cache/vfd-lantern-cargo-install-target"
          sh scripts/install-cargo-tools.sh supply-chain
          export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
          CARGO_VET_REPORT=target/supply-chain/cargo-vet-summary-amd64.json sh scripts/check-supply-chain.sh
          git rm .github/workflows/issue19-final-acceptance-stage.yml
          git rm .github/scripts/issue19_acceptance_stage.rs
          git rm .github/scripts/issue19_acceptance_persist_fix.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(#19): close CSV acceptance and supply chain'
          git push origin HEAD:agent/issue-19
