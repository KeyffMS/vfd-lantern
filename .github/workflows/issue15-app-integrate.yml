name: Integrate issue 15 application state

on:
  push:
    branches: [agent/issue-15]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-15
          fetch-depth: 0
      - name: Integrate application and polling runtime
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/issue15_edit.rs -o /tmp/issue15_edit
          rustc --edition=2024 .github/issue15_fix.rs -o /tmp/issue15_fix
          /tmp/issue15_edit
          /tmp/issue15_fix
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --locked -p lantern-app --all-features
          git rm .github/workflows/issue15-app-integrate.yml .github/issue15_edit.rs .github/issue15_fix.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#15): integrate parameter browser with application polling'
          git push origin HEAD:agent/issue-15
