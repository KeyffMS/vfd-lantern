name: Stage issue 17 storage and CLI

on:
  push:
    branches:
      - agent/issue-17-stage-storage-cli

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-17-stage-storage-cli
          fetch-depth: 0
      - name: Validate and persist backup storage and CLI
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue17_storage_cli_stage.rs -o /tmp/issue17-storage-cli-stage
          /tmp/issue17-storage-cli-stage
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          git add crates/lantern-storage/src/backup.rs crates/vfd-lantern/src/backup_commands.rs crates/vfd-lantern/src/main.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(#17): harden backup artifacts and expose offline diff'
            git push origin HEAD:agent/issue-17-stage-storage-cli
          fi
