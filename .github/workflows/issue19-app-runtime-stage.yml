name: Stage issue 19 CSV application runtime

on:
  push:
    branches:
      - agent/issue-19

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-19
          fetch-depth: 0
      - name: Integrate CSV application and monitoring runtime
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/apply_issue19_app_runtime_stage.rs -o /tmp/apply-issue19-runtime
          /tmp/apply-issue19-runtime
          sed -i '/impl TuiRuntimePaths/,/^}/ s/diagnostics_directory: paths\.diagnostics_directory/diagnostics_directory/' crates/vfd-lantern/src/connection_runtime.rs
          sed -i '/impl TuiRuntimePaths/,/^}/ s/fault_report_directory: paths\.fault_report_directory/fault_report_directory/' crates/vfd-lantern/src/connection_runtime.rs
          sed -i '/impl TuiEffectRunner/,/^}/ s/^            diagnostics_directory,$/            diagnostics_directory: paths.diagnostics_directory,/' crates/vfd-lantern/src/connection_runtime.rs
          sed -i '/impl TuiEffectRunner/,/^}/ s/^            fault_report_directory,$/            fault_report_directory: paths.fault_report_directory,/' crates/vfd-lantern/src/connection_runtime.rs
          cargo fmt --all
          cargo check --workspace --all-features
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git rm .github/workflows/issue19-app-runtime-stage.yml
          git rm .github/scripts/issue19_app_runtime_stage.py
          git rm .github/scripts/apply_issue19_app_runtime_stage.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#19): integrate CSV application and monitoring runtime'
          git push origin HEAD:agent/issue-19
