name: Stage issue 19 CSV application runtime

on:
  push:
    branches:
      - agent/issue-19

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-19
          fetch-depth: 0
      - name: Integrate CSV application and monitoring runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/issue19_app_runtime_stage.py
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git rm .github/workflows/issue19-app-runtime-stage.yml
          git rm .github/scripts/issue19_app_runtime_stage.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#19): integrate CSV application and monitoring runtime'
          git push origin HEAD:agent/issue-19
