name: Stage issue 18 fault runtime integration

on:
  push:
    branches: [agent/issue-18]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-18
          fetch-depth: 0
      - name: Integrate fault feed, freeze-frame and export runtime
        shell: bash
        run: |
          set -euo pipefail

          faults=crates/lantern-app/src/faults.rs
          app=crates/lantern-app/src/application.rs
          mon=crates/vfd-lantern/src/monitoring_runtime.rs
          conn=crates/vfd-lantern/src/connection_runtime.rs
          main=crates/vfd-lantern/src/main.rs

          perl -0pi -e 's/    CaptureFreezeFrame \{\n        event_id: FaultEventId,\n        session_id: SessionId,\n        parameters: Vec<ParameterId>,\n    \},/    CaptureFreezeFrame {\n        event_id: FaultEventId,\n        session_id: SessionId,\n        profile: Arc<ValidatedDeviceProfile>,\n        parameters: Vec<ParameterId>,\n    },/' "$faults"
          perl -0pi -e 's/session_id: detection\.session_id,\n                            parameters:/session_id: detection.session_id,\n                            profile: Arc::clone(\&profile),\n                            parameters:/' "$app"

          perl -0pi -e 's/ApplicationAction, ApplicationEffectError, BusControlPort/ApplicationAction, ApplicationEffectError, BusControlPort, FaultAction/' "$mon"
          perl -0pi -e 's/ValidatedDeviceProfile, ValidatedSettings, dashboard_subscriptions,/ValidatedDeviceProfile, ValidatedSettings, dashboard_subscriptions, fault_subscription,/' "$mon"
          perl -0pi -e 's/let consumer_tasks = drain_consumers\(consumers\);/let consumer_tasks = drain_consumers(\n            consumers,\n            self.action_tx.clone(),\n            Arc::downgrade(\&self.shared),\n        );/' "$mon"
          perl -0pi -e 's/(subscriptions\.extend\(\n        parameter_browser_subscriptions\(profile, parameter_browser_parameters\)\n            \.map_err\(\|error\| error\.to_string\(\)\)\?,\n    \);)/$1\n    if let Some(fault) = fault_subscription(profile).map_err(|error| error.to_string())? {\n        subscriptions.push(fault);\n    }/' "$mon"

          cat > /tmp/drain_faults.rs <<'RS'
          fn drain_consumers(
              consumers: TelemetryConsumers,
              action_tx: mpsc::UnboundedSender<ApplicationAction>,
              shared: Weak<MonitoringShared>,
          ) -> Vec<JoinHandle<()>> {
              let TelemetryConsumers {
                  tui: _tui,
                  csv,
                  fault,
                  diagnostics,
              } = consumers;
              vec![
                  drain(csv),
                  forward_faults(fault, action_tx, shared),
                  drain(diagnostics),
              ]
          }

          fn forward_faults(
              mut receiver: mpsc::Receiver<TelemetryEvent>,
              action_tx: mpsc::UnboundedSender<ApplicationAction>,
              shared: Weak<MonitoringShared>,
          ) -> JoinHandle<()> {
              tokio::spawn(async move {
                  while let Some(event) = receiver.recv().await {
                      let Some(shared) = shared.upgrade() else {
                          return;
                      };
                      let (is_fault_source, bus) = {
                          let state = lock_state(&shared.state);
                          let Some(active) = state.active.as_ref() else {
                              continue;
                          };
                          let is_fault_source = active
                              .profile
                              .fault_source()
                              .is_some_and(|source| source.parameter_id == event.parameter_id);
                          let bus = state
                              .bus
                              .as_ref()
                              .map_or_else(Default::default, |bus| bus.statistics());
                          (is_fault_source, bus)
                      };
                      if !is_fault_source {
                          continue;
                      }
                      if action_tx
                          .send(ApplicationAction::Faults(FaultAction::ObserveTelemetry {
                              event,
                              bus,
                          }))
                          .is_err()
                      {
                          return;
                      }
                  }
              })
          }
          RS
          perl -0pi -e 's/fn drain_consumers\(consumers: TelemetryConsumers\) -> Vec<JoinHandle<\(\)>> \{.*?\n\}\n\nfn drain\(/`cat \/tmp\/drain_faults.rs` . "\nfn drain("/se' "$mon"

          perl -0pi -e 's/ConnectionEffect, EffectRunner, IdentificationReportExportV1/ConnectionEffect, EffectRunner, FaultAction, FaultEffect, IdentificationReportExportV1/' "$conn"
          perl -0pi -e 's/use lantern_storage::create_new_synced;/use lantern_storage::{create_new_synced, write_fault_report};/' "$conn"
          perl -0pi -e 's/use crate::monitoring_runtime::MonitoringRuntime;/use crate::{fault_runtime::spawn_freeze_frame_capture, monitoring_runtime::MonitoringRuntime};/' "$conn"
          perl -0pi -e 's/    diagnostics_directory: PathBuf,\n/    diagnostics_directory: PathBuf,\n    fault_report_directory: PathBuf,\n/' "$conn"
          perl -0pi -e 's/        diagnostics_directory: PathBuf,\n        settings:/        diagnostics_directory: PathBuf,\n        fault_report_directory: PathBuf,\n        settings:/' "$conn"
          perl -0pi -e 's/            monitoring,\n            diagnostics_directory,\n/            monitoring,\n            diagnostics_directory,\n            fault_report_directory,\n/' "$conn"

          cat > /tmp/execute_fault.rs <<'RS'
              fn execute_fault(&mut self, effect: FaultEffect) -> Result<(), ApplicationEffectError> {
                  match effect {
                      FaultEffect::CaptureFreezeFrame {
                          event_id,
                          session_id,
                          profile,
                          parameters,
                      } => {
                          let (bus, slave_id) = {
                              let state = lock_runtime(&self.runtime);
                              (
                                  state.bus.as_ref().map(|active| active.handle.clone()),
                                  state.bus.as_ref().map(|active| active.slave_id),
                              )
                          };
                          spawn_freeze_frame_capture(
                              profile,
                              bus,
                              slave_id,
                              event_id,
                              session_id,
                              parameters,
                              self.action_tx.clone(),
                          );
                          Ok(())
                      }
                      FaultEffect::Export {
                          suggested_name,
                          event,
                      } => {
                          let result = write_fault_report(
                              &self.fault_report_directory,
                              &suggested_name,
                              &event,
                          )
                          .map_err(|error| error.to_string());
                          send_action(
                              &self.action_tx,
                              ApplicationAction::Faults(FaultAction::ExportFinished(result)),
                          )
                      }
                  }
              }

          RS
          awk 'BEGIN{done=0} /^    fn execute_session/ && !done { while ((getline line < "/tmp/execute_fault.rs") > 0) print line; close("/tmp/execute_fault.rs"); done=1 } {print}' "$conn" > /tmp/connection_runtime.rs
          mv /tmp/connection_runtime.rs "$conn"
          perl -0pi -e 's/ApplicationEffect::Monitoring\(effect\) => self\.monitoring\.execute\(effect\),\n            ApplicationEffect::Session/ApplicationEffect::Monitoring(effect) => self.monitoring.execute(effect),\n            ApplicationEffect::Faults(effect) => self.execute_fault(effect),\n            ApplicationEffect::Session/' "$conn"

          perl -0pi -e 's/mod connection_runtime;\n/mod connection_runtime;\nmod fault_runtime;\n/' "$main"
          perl -0pi -e 's/        paths\.diagnostics_directory\.clone\(\),\n        settings\.clone\(\),/        paths.diagnostics_directory.clone(),\n        paths.fault_report_directory.clone(),\n        settings.clone(),/' "$main"

          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test -p lantern-app -p lantern-storage -p vfd-lantern --all-features --locked

          git rm .github/workflows/issue18-runtime-integration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#18): wire TelemetryCritical faults and interactive freeze-frame runtime'
          git push origin HEAD:agent/issue-18
