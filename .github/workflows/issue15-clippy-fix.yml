name: Fix issue 15 clippy type

on:
  push:
    branches: [agent/issue-15]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-15
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          file=crates/lantern-profile/src/validate/build/parameter.rs
          sed -i '/^fn validate_editor_metadata(/i type EditorMetadata = (BTreeMap<i64, String>, BTreeMap<u8, String>);\n' "$file"
          sed -i 's/) -> Result<(BTreeMap<i64, String>, BTreeMap<u8, String>), ProfileError> {/) -> Result<EditorMetadata, ProfileError> {/' "$file"

          bench=crates/lantern-tui/src/parameter_benchmark.rs
          sed -i '0,/    let mut ui = UiState::default();/s//    let mut ui = UiState {\n        screen: Screen::Parameters,\n        viewport: crate::Viewport {\n            width: BENCHMARK_WIDTH,\n            height: BENCHMARK_HEIGHT,\n            ..crate::Viewport::default()\n        },\n        parameters: ParameterUiState::default(),\n        ..UiState::default()\n    };/' "$bench"
          sed -i '/^    ui\.screen = Screen::Parameters;$/d;/^    ui\.viewport\.width = BENCHMARK_WIDTH;$/d;/^    ui\.viewport\.height = BENCHMARK_HEIGHT;$/d;/^    ui\.parameters = ParameterUiState::default();$/d' "$bench"

          keymap=crates/lantern-tui/src/parameter_keymap.rs
          perl -0pi -e 's/value\n\s+\.is_finite\(\)\n\s+\.then\(\|\| value\.to_string\(\)\)\n\s+\.unwrap_or_default\(\)/if value.is_finite() { value.to_string() } else { String::new() }/g' "$keymap"

          render=crates/lantern-tui/src/parameter_render.rs
          sed -i '/^        ui\.parameters = ParameterUiState::default();$/d' "$render"
          sed -i 's/use crate::{ParameterUiState, UiState, filtered_parameters};/use crate::{UiState, filtered_parameters};/' "$render"

          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git rm .github/workflows/issue15-clippy-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(#15): satisfy final clippy gates'
          git push origin HEAD:agent/issue-15
