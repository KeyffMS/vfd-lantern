name: Stage issue 17 backup and diff

on:
  push:
    branches:
      - agent/issue-17-stage-backup-diff

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-17-stage-backup-diff
          fetch-depth: 0
      - name: Validate and persist backup and semantic diff slice
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue17_backup_diff_fix.rs -o /tmp/issue17-backup-diff-fix
          /tmp/issue17-backup-diff-fix
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          git add crates/lantern-domain/src/backup.rs crates/lantern-domain/src/lib.rs \
            crates/lantern-app/src/backup.rs crates/lantern-app/src/lib.rs \
            crates/lantern-storage/src/atomic.rs crates/lantern-storage/src/backup.rs \
            crates/lantern-storage/src/lib.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(#17): implement canonical backup and semantic diff core'
            git push origin HEAD:agent/issue-17-stage-backup-diff
          fi
