name: Refresh issue 18 simulator profile hash fixtures

on:
  push:
    branches: [agent/issue-18]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-18
          fetch-depth: 0
      - name: Refresh profile-bound simulator fixtures
        shell: bash
        run: |
          set -euo pipefail
          old='a3ef7e13b076868f2bc0f05cd26f7df1343aa01ec6879040ad5d0de868c6336c'
          new='2987e481b3d6c33c2c703338a5e848b979c36c14d84cf4deb5c6f9e6511c53fe'
          files=(
            crates/lantern-sim/src/scenario.rs
            scenarios/example-read-only.toml
          )

          for file in "${files[@]}"; do
            count=$(grep -oF "$old" "$file" | wc -l)
            test "$count" -eq 1
            sed -i "s/$old/$new/" "$file"
            ! grep -F "$old" "$file"
            count_new=$(grep -oF "$new" "$file" | wc -l)
            test "$count_new" -eq 1
          done

          cargo fmt --all -- --check
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

          git rm .github/workflows/issue18-profile-hash-refresh.yml
          git add crates/lantern-sim/src/scenario.rs scenarios/example-read-only.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(#18): refresh profile-bound simulator hashes'
          git push origin HEAD:agent/issue-18
