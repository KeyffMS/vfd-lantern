name: Stage issue 23 operator flow

on:
  push:
    branches:
      - agent/issue-23
    paths:
      - '.github/scripts/issue23_operator_flow_stage.rs'
      - '.github/scripts/issue23_operator_flow_anchor_fix.rs'
      - '.github/scripts/issue23_operator_flow_fix.rs'
      - '.github/scripts/issue23_operator_flow_clippy_fix.rs'
      - '.github/workflows/issue23-operator-flow-stage.yml'
      - 'crates/lantern-app/**'
      - 'crates/lantern-tui/**'
      - 'crates/vfd-lantern/**'
      - 'docs/development/threat-model.md'
      - 'scripts/check-architecture.sh'

permissions:
  contents: write

jobs:
  operator-flow:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/issue-23
          fetch-depth: 0
      - name: Integrate and validate explicit operator write flow
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 .github/scripts/issue23_operator_flow_anchor_fix.rs -o /tmp/issue23-operator-flow-anchor-fix
          /tmp/issue23-operator-flow-anchor-fix
          rustc --edition=2024 .github/scripts/issue23_operator_flow_stage.rs -o /tmp/issue23-operator-flow-stage
          /tmp/issue23-operator-flow-stage
          rustc --edition=2024 .github/scripts/issue23_operator_flow_fix.rs -o /tmp/issue23-operator-flow-fix
          /tmp/issue23-operator-flow-fix
          rustc --edition=2024 .github/scripts/issue23_operator_flow_clippy_fix.rs -o /tmp/issue23-operator-flow-clippy-fix
          /tmp/issue23-operator-flow-clippy-fix
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
          sh scripts/check-architecture.sh
          git rm .github/workflows/issue23-operator-flow-stage.yml
          git rm .github/scripts/issue23_operator_flow_stage.rs
          git rm .github/scripts/issue23_operator_flow_anchor_fix.rs
          git rm .github/scripts/issue23_operator_flow_fix.rs
          git rm .github/scripts/issue23_operator_flow_clippy_fix.rs
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(#23): add explicit arming and guarded write confirmation flow'
          git push origin HEAD:agent/issue-23
