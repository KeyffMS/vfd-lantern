name: M6.5.2 harness integration helper

on:
  push:
    branches:
      - agent/m6.5.2-backup-restore-pty

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, linux, x64, podman, vfd-lantern]
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/m6.5.2-backup-restore-pty
          fetch-depth: 0
      - name: Install pinned toolchain
        run: |
          set -eu
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Integrate module, verify and self-clean
        run: |
          set -eu
          test -f crates/lantern-sim/examples/backup_restore_process.rs
          test ! -e crates/lantern-sim/examples/support/backup_restore_process.rs
          mkdir -p crates/lantern-sim/examples/support
          git mv crates/lantern-sim/examples/backup_restore_process.rs crates/lantern-sim/examples/support/backup_restore_process.rs

          harness=crates/lantern-sim/examples/connection_process_acceptance.rs
          test "$(grep -Fxc 'use tempfile::TempDir;' "$harness")" -eq 1
          sed -i '/^use tempfile::TempDir;$/a\\n#[path = "support/backup_restore_process.rs"]\nmod backup_restore_process;' "$harness"
          test "$(grep -Fxc '        println!("process-e2e simulator-device-rejection-no-retry ok");' "$harness")" -eq 1
          sed -i '/process-e2e simulator-device-rejection-no-retry ok/a\        backup_restore_process::run_backup_restore_process_matrix(\&simulator, \&product)?;\n        println!("process-e2e backup-diff-restore-pty-matrix ok");' "$harness"

          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git rm .github/workflows/m652-integrate-helper.yml
          git add crates/lantern-sim/examples/connection_process_acceptance.rs crates/lantern-sim/examples/support/backup_restore_process.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: wire M6.5.2 restore matrix into process harness"
          git push origin HEAD:agent/m6.5.2-backup-restore-pty
