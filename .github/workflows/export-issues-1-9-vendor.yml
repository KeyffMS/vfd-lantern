name: Export issues 1-9 vendored dependencies

on:
  push:
    branches:
      - agent/export-issues-1-9-closeout

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git rustup

      - name: Check out export branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Vendor exact locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin \
            +refs/heads/agent/issues-1-9:refs/remotes/origin/agent/issues-1-9
          git checkout --detach refs/remotes/origin/agent/issues-1-9
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          tar -czf vfd-lantern-vendor.tar.gz vendor .cargo/config.toml Cargo.lock
          sha256sum vfd-lantern-vendor.tar.gz > SHA256SUMS.vendor

      - name: Upload vendored dependency graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issues-1-9-vendor
          path: |
            vfd-lantern-vendor.tar.gz
            SHA256SUMS.vendor
          if-no-files-found: error
          retention-days: 1
