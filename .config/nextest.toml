[profile.default]
retries = 0
fail-fast = false
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.default.junit]
path = "junit.xml"

[test-groups]
pty-serial = { max-threads = 1 }
filesystem-faults = { max-threads = 1 }
fast = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(lantern-sim) | package(lantern-transport)'
test-group = 'pty-serial'

[[profile.default.overrides]]
filter = 'package(lantern-storage)'
test-group = 'filesystem-faults'

[[profile.default.overrides]]
filter = 'all()'
test-group = 'fast'
