[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.3"
ci = "github"
# VFD Lantern owns release orchestration in release-candidate-build/finalize/publish.
# cargo-dist is used only to plan/build product archives, so its generated CI is intentionally ignored.
allow-dirty = ["ci"]
installers = []
# Active scope: Debian 13 amd64; platform expansion is end-of-queue work.
targets = ["x86_64-unknown-linux-gnu"]
precise-builds = true
unix-archive = ".tar.xz"
cargo-auditable = true
cargo-cyclonedx = true
github-attestations = true
pr-run-mode = "skip"
include = ["README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md"]

# Runner routing is owned by the hand-written self-hosted workflows above.
